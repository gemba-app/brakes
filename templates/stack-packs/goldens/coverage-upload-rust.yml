# rust: the test job's coverage steps (#20)
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: "cargo-llvm-cov@0.9.1"
      - name: Run the tests under coverage
        run: |-
          eval "$(cargo llvm-cov show-env --sh)"
          cargo llvm-cov clean --workspace
          bash -euo pipefail -c "$TEST_COMMAND"
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Upload the coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: agentic-coverage-root-test
          path: lcov.info
