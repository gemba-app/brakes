# rust: the test job's coverage steps (#20)
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: "cargo-llvm-cov@0.9.1"
      - name: Run the tests under coverage
        run: |-
          eval "$(cargo llvm-cov show-env --sh)"
          cargo llvm-cov clean --workspace
          bash -euo pipefail -c "$TEST_COMMAND"
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Upload the coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: agentic-coverage-root-test
          path: lcov.info
