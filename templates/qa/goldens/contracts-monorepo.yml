            parents=$(git rev-list --parents -n 1 HEAD | wc -w)
            [ "$parents" -ge 3 ] || fail "HEAD is not a merge commit; cannot find the base"
            approved=false
            if printf '%s' "${PR_LABELS:-[]}" | jq -e 'type == "array" and index("human-approved") != null' > /dev/null 2>&1; then
