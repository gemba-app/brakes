            mkdir -p "$out/$1/$(dirname "$2")"
            printf '%s\n' "$out/$1/$2.$3"
          }

          for contract in ${openapi[@]+"${openapi[@]}"} ${asyncapi[@]+"${asyncapi[@]}"}; do
            found=$(external_ref "$contract")
