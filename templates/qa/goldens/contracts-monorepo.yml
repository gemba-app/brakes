name: CI
# Generated by brakes ci-baseline 1.0.0 from .agent-setup/project.json and
# .agent-setup/modules/ci-baseline.json. Edit those and re-run the installer; a hand
# edit here is refused as a conflict. Commands are read at run time, never invented.
# Pinned by SHA; when GitHub's workflow lockfile leaves preview, `gh actions-lock`
# supersedes these pins (decision pending).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    name: scope
    runs-on: example-cloud-2
    timeout-minutes: 5
    outputs:
      tier: "${{ steps.scope.outputs.tier }}"
      skippable: "${{ steps.scope.outputs.skippable }}"
      protected: "${{ steps.scope.outputs.protected }}"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          persist-credentials: "false"
      - id: scope
        name: Decide the tier and the skippable jobs
        env:
          APPS: |-
            events=apps/events
            shop=apps/shop
          APP_JOBS: |-
            events-qa-contracts=events
            shop-qa-contracts=shop
          BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          DOCS_SKIPPABLE: |-
            events-checks
            shop-checks
            heldout
          EVENT: "${{ github.event_name }}"
          HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
          INERT_PATHS: |-
            docs/**
            tasks/**
            **/*.md
          PROTECTED_PATHS: |-
            .github/workflows/**
            .github/rulesets/**
            .github/CODEOWNERS
            .agent-setup/project.json
            tests/heldout/**
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          : "${GITHUB_OUTPUT:?GITHUB_OUTPUT is not set}"
          event=${EVENT:-}
          inert_paths=${INERT_PATHS:-}
          docs_skippable=${DOCS_SKIPPABLE:-}
          apps=${APPS:-}
          protected_paths=${PROTECTED_PATHS:-}

          emit() {
            printf '%s=%s\n' "$1" "$2" | tee -a "$GITHUB_OUTPUT"
          }

          tier=full
          diffed=false
          listed=false
          files=""
          if [ "$event" = pull_request ] && [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ] \
            && files="$(git -c diff.renames=false -c core.quotePath=false diff --name-only "$BASE_SHA...$HEAD_SHA")"; then
            diffed=true
            [ -z "$files" ] || listed=true
          fi

          matches() {
            local glob
            while IFS= read -r glob; do
              case "$glob" in '' | '!'*) continue ;; esac
              # shellcheck disable=SC2254 # the glob must stay unquoted to act as a pattern
              case "$1" in $glob | ${glob#"**/"}) return 0 ;; esac
            done <<< "$2"
            return 1
          }

          negated=""
          while IFS= read -r glob; do
            case "$glob" in '!'*) negated="$negated $glob" ;; esac
          done <<< "$inert_paths"
          if [ -n "$negated" ]; then
            echo "::warning::inert_paths carries a negation (${negated# }); negations are never evaluated, tier stays full"
          fi

          is_inert() {
            case "$1" in .github/workflows/*) return 1 ;; esac
            if matches "$1" "$protected_paths"; then
              return 1
            fi
            matches "$1" "$inert_paths"
          }

          if $listed && [ -z "$negated" ]; then
            tier=docs
            while IFS= read -r file; do
              if ! is_inert "$file"; then
                tier=full
                break
              fi
            done <<< "$files"
          fi

          ids=""
          add() {
            case $'\n'"$ids" in *$'\n'"$1"$'\n'*) return 0 ;; esac
            ids="$ids$1"$'\n'
          }

          if [ "$event" = pull_request ]; then
            if $listed; then
              if [ "$tier" = docs ]; then
                while IFS= read -r id; do
                  [ -n "$id" ] && add "$id"
                done <<< "$docs_skippable"
              fi
              workflow=false
              while IFS= read -r file; do
                case "$file" in .github/*) workflow=true ;; esac
              done <<< "$files"
              if ! $workflow; then
                add workflow-lint
              fi
            fi
          fi
          if [ "$event" != push ]; then
            add macos
          fi

          changed_apps=""
          outside=false
          if $listed; then
            while IFS= read -r file; do
              owner=""
              while IFS= read -r app; do
                [ -n "$app" ] || continue
                id=${app%%=*}
                path=${app#*=}
                path=${path%/}
                case "$file" in "$path"/*) owner=$id; changed_apps="$changed_apps $id " ;; esac
              done <<< "$apps"
              if [ -z "$owner" ]; then
                outside=true
              fi
            done <<< "$files"
          fi

          flags=""
          while IFS= read -r app; do
            [ -n "$app" ] || continue
            id=${app%%=*}
            changed=true
            if $listed && ! $outside; then
              case "$changed_apps" in *" $id "*) ;; *) changed=false; add "$id-checks" ;; esac
            fi
            flags="$flags$id=$changed"$'\n'
          done <<< "$apps"

          while IFS= read -r pair; do
            [ -n "$pair" ] || continue
            job=${pair%%=*}
            app=${pair#*=}
            case $'\n'"$flags" in
              *$'\n'"$app=false"$'\n'*) add "$job" ;;
            esac
          done <<< "${APP_JOBS:-}"
          skippable="$(printf '%s' "$ids" | jq -R . | jq -cs .)"

          negated=""
          while IFS= read -r glob; do
            case "$glob" in '!'*) negated="$negated $glob" ;; esac
          done <<< "$protected_paths"
          if [ -n "$negated" ]; then
            echo "::warning::protected_paths carries a negation (${negated# }); negations are never evaluated and protect nothing less"
          fi
          pin_re='^([[:space:]]*(- )?use[s]:[[:space:]]*)([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)(/[A-Za-z0-9_./-]+)?@([0-9a-f]{40})[[:space:]]+#[[:space:]]*([A-Za-z0-9_.+-]+)[[:space:]]*$'

          is_tag_commit() {
            local refs sha ref direct="" peeled=""
            refs="$(GIT_TERMINAL_PROMPT=0 git ls-remote --tags "https://github.com/$1" "refs/tags/$2" "refs/tags/$2^{}" 2>/dev/null)" || return 1
            while IFS=$'\t' read -r sha ref; do
              [ "$ref" = "refs/tags/$2" ] && direct=$sha
              [ "$ref" = "refs/tags/$2^{}" ] && peeled=$sha
            done <<< "$refs"
            [ -z "$peeled" ] || direct=$peeled
            [ -n "$direct" ] && [ "$direct" = "$3" ]
          }

          is_pin_pair() {
            local prefix action
            [[ $1 =~ $pin_re ]] || return 1
            prefix=${BASH_REMATCH[1]}
            action=${BASH_REMATCH[3]}${BASH_REMATCH[4]}
            [[ $2 =~ $pin_re ]] || return 1
            [ "${BASH_REMATCH[1]}" = "$prefix" ] || return 1
            [ "${BASH_REMATCH[3]}${BASH_REMATCH[4]}" = "$action" ] || return 1
            is_tag_commit "${BASH_REMATCH[3]}" "${BASH_REMATCH[6]}" "${BASH_REMATCH[5]}"
          }

          is_pin_bump() {
            local diff line pending="" old hunk=false
            diff="$(git -c diff.renames=false -c core.quotePath=false diff -U0 --no-color --no-ext-diff "$BASE_SHA...$HEAD_SHA" -- "$1")" || return 1
            [ -n "$diff" ] || return 1
            while IFS= read -r line; do
              if ! $hunk; then
                case "$line" in
                  'diff --git '* | 'index '* | '--- a/'* | '+++ b/'*) continue ;;
                  '@@ '*) hunk=true; continue ;;
                  *) return 1 ;;
                esac
              fi
              case "$line" in
                '@@ '*) [ -z "$pending" ] || return 1 ;;
                -*) pending="$pending${line#-}"$'\n' ;;
                +*)
                  [ -n "$pending" ] || return 1
                  old=${pending%%$'\n'*}
                  pending=${pending#*$'\n'}
                  is_pin_pair "$old" "${line#+}" || return 1
                  ;;
                *) return 1 ;;
              esac
            done <<< "$diff"
            $hunk && [ -z "$pending" ]
          }

          changed_protected=""
          if [ "$event" = pull_request ] && ! $diffed; then
            changed_protected='<unknown>'$'\n'
          elif $listed; then
            while IFS= read -r file; do
              if matches "$file" "$protected_paths" && ! is_pin_bump "$file"; then
                changed_protected="$changed_protected$file"$'\n'
              fi
            done <<< "$files"
          fi
          protected="$(printf '%s' "$changed_protected" | jq -R . | jq -cs .)"

          emit tier "$tier"
          emit skippable "$skippable"
          emit protected "$protected"
          while IFS= read -r flag; do
            [ -n "$flag" ] || continue
            emit "changed-${flag%%=*}" "${flag#*=}"
          done <<< "$flags"
  events-checks:
    name: events-checks
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.skippable), 'events-checks') == false
    runs-on: example-cloud-2
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: "false"
      - name: Restore npm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: "${{ runner.os }}-npm-${{ hashFiles('apps/events/package-lock.json') }}"
          path: "~/.npm"
      - name: Install dependencies
        working-directory: apps/events
        run: npm ci
      - name: Save npm store
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: "${{ runner.os }}-npm-${{ hashFiles('apps/events/package-lock.json') }}"
          path: "~/.npm"
      - name: Run declared test
        working-directory: apps/events
        env:
          NAME: test
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          : "${NAME:?NAME is not set}"
          cmd="$(jq -r --arg name "$NAME" '.commands[$name] // empty' .agent-setup/project.json)"
          if [ -z "$cmd" ]; then
            echo "::error::Verification command missing: commands.$NAME is not declared in .agent-setup/project.json"
            exit 1
          fi
          echo "$NAME: $cmd"
          bash -euo pipefail -c "$cmd"
  shop-checks:
    name: shop-checks
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.skippable), 'shop-checks') == false
    runs-on: example-cloud-2
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          components: "clippy, rustfmt"
          toolchain: "1.99"
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: "${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}"
          workspaces: apps/shop
      - name: Run declared test
        working-directory: apps/shop
        env:
          NAME: test
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          : "${NAME:?NAME is not set}"
          cmd="$(jq -r --arg name "$NAME" '.commands[$name] // empty' .agent-setup/project.json)"
          if [ -z "$cmd" ]; then
            echo "::error::Verification command missing: commands.$NAME is not declared in .agent-setup/project.json"
            exit 1
          fi
          echo "$NAME: $cmd"
          bash -euo pipefail -c "$cmd"
  heldout:
    name: heldout
    needs: scope
    if: needs.scope.outputs.tier != 'docs'
    runs-on: example-cloud-2
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Check held-out tests are pending
        env:
          HELDOUT_DIR: tests/heldout
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          : "${HELDOUT_DIR:?HELDOUT_DIR is not set}"
          files=""
          if [ -e "$HELDOUT_DIR" ]; then
            files="$(find "$HELDOUT_DIR" ! -type d | LC_ALL=C sort)"
          fi
          if [ -n "$files" ]; then
            echo "heldout: $HELDOUT_DIR holds tests and heldout_command is not answered; answer it so the job runs them"
            printf '%s\n' "$files"
            exit 1
          fi
          echo "heldout: no held-out tests yet under $HELDOUT_DIR; answer heldout_command when the first one lands"
  workflow-lint:
    name: workflow-lint
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.skippable), 'workflow-lint') == false
    runs-on: example-cloud-2
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Install actionlint
        env:
          TOOL_BIN: actionlint
          TOOL_FORMAT: tgz
          TOOL_NAME: actionlint
          TOOL_SHA256_AMD64: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          TOOL_SHA256_ARM64: "325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6"
          TOOL_URL_AMD64: "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          TOOL_URL_ARM64: "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_arm64.tar.gz"
          TOOL_VERSION: "1.7.12"
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          for name in TOOL_NAME TOOL_VERSION TOOL_BIN TOOL_FORMAT \
            TOOL_URL_AMD64 TOOL_SHA256_AMD64 TOOL_URL_ARM64 TOOL_SHA256_ARM64; do
            if [ -z "${!name:-}" ]; then
              echo "::error::security: install-tool.sh needs $name"
              exit 1
            fi
          done

          fail() {
            echo "::error::security: $TOOL_NAME $TOOL_VERSION $*"
            exit 1
          }

          digest() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | cut -d' ' -f1
            else
              shasum -a 256 "$1" | cut -d' ' -f1
            fi
          }

          case "$TOOL_FORMAT" in
            tgz | bin) ;;
            *) fail "unknown format $TOOL_FORMAT" ;;
          esac

          bin_path="${TOOL_BIN_PATH:-}"
          if [ -n "$bin_path" ]; then
            if [ "$TOOL_FORMAT" != tgz ]; then
              fail "TOOL_BIN_PATH needs format tgz, got $TOOL_FORMAT"
            fi
            case "/$bin_path/" in
              //* | */../*) fail "TOOL_BIN_PATH $bin_path must be relative to the archive root without .." ;;
            esac
          fi

          archive_member() {
            local root dir found
            local matches=()
            root="$(cd -P "$1" && pwd -P)"
            while IFS= read -r found; do
              matches+=("$found")
            done < <(compgen -G "$1/$bin_path")
            if [ "${#matches[@]}" -ne 1 ]; then
              fail "($arch) TOOL_BIN_PATH $bin_path matches ${#matches[@]} files in the archive; exactly one is required"
            fi
            if [ -L "${matches[0]}" ] || [ ! -f "${matches[0]}" ]; then
              fail "($arch) TOOL_BIN_PATH $bin_path is not a regular file inside the archive"
            fi
            dir="$(cd -P "$(dirname "${matches[0]}")" && pwd -P)"
            case "$dir/" in
              "$root"/*) ;;
              *) fail "($arch) TOOL_BIN_PATH $bin_path is not a regular file inside the archive" ;;
            esac
            member="${matches[0]}"
          }

          machine="$(uname -m)"
          case "$machine" in
            x86_64 | amd64)
              arch=amd64
              url="$TOOL_URL_AMD64"
              expected="$TOOL_SHA256_AMD64"
              ;;
            aarch64 | arm64)
              arch=arm64
              url="$TOOL_URL_ARM64"
              expected="$TOOL_SHA256_ARM64"
              ;;
            *) fail "has no pin for architecture $machine" ;;
          esac

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          file="$tmp/$TOOL_NAME-$arch.download"

          echo "install: $TOOL_NAME $TOOL_VERSION $arch from $url"
          if ! curl -fsSL --retry 3 -o "$file" "$url"; then
            fail "($arch) download failed: $url"
          fi

          actual="$(digest "$file")"
          if [ "$actual" != "$expected" ]; then
            fail "($arch) checksum mismatch: expected $expected, got $actual; nothing was installed"
          fi

          bin_dir="${TOOL_BIN_DIR:-${RUNNER_TEMP:-$PWD}/brakes-bin}"
          mkdir -p "$bin_dir"
          case "$TOOL_FORMAT" in
            tgz)
              mkdir "$tmp/extract"
              tar -xzf "$file" -C "$tmp/extract"
              member="$tmp/extract/$TOOL_BIN"
              if [ -n "$bin_path" ]; then
                archive_member "$tmp/extract"
              elif [ ! -f "$member" ]; then
                fail "($arch) archive has no $TOOL_BIN at its root"
              fi
              install -m 0755 "$member" "$bin_dir/$TOOL_BIN"
              ;;
            bin)
              install -m 0755 "$file" "$bin_dir/$TOOL_BIN"
              ;;
          esac

          if [ -n "${GITHUB_PATH:-}" ]; then
            echo "$bin_dir" >>"$GITHUB_PATH"
          fi
          echo "tool: $TOOL_NAME $TOOL_VERSION sha256=$actual"
      - name: Lint workflows with actionlint
        run: actionlint
      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: "false"
          annotations: "true"
          min-severity: medium
          persona: regular
          version: "1.31.1"
  events-qa-contracts:
    name: events-qa-contracts
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.skippable), 'events-qa-contracts') == false
    runs-on: example-cloud-2
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "2"
          persist-credentials: "false"
      - name: Set up Node for the AsyncAPI CLI
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: "false"
      - name: Install the AsyncAPI CLI
        env:
          QA_ASYNCAPI_CLI: "6.2.1"
        run: |
          npm install --prefix "$RUNNER_TEMP/qa/asyncapi-cli" --ignore-scripts --no-audit --no-fund "@asyncapi/cli@$QA_ASYNCAPI_CLI"
          echo "$RUNNER_TEMP/qa/asyncapi-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Lint the contracts
        working-directory: "apps/events"
        env:
          QA_ASYNCAPI: "asyncapi.yaml"
          QA_ASYNCAPI_VERSION: "6.2.1"
          QA_STAGE: lint
        run: |
          #!/usr/bin/env bash
          # contracts-check.sh, the check of qa-contracts (SPEC-qa.md, Contracts): lint the
          # answered contracts and, on a pull request, compare each with the base's file
          # or with its declared published copy (#1182).
          # Inputs, all from `env:`:
          #   QA_STAGE             lint | compat
          #   QA_OUT               the report directory (default $RUNNER_TEMP/qa/contracts),
          #                        uploaded as the artifact
          #   QA_OPENAPI           the OpenAPI 3 contracts, separated by commas, or empty
          #   QA_ASYNCAPI          the AsyncAPI contracts, separated by commas, or empty
          #   QA_PUBLISHED         <live>=<published> pairs separated by commas, or empty
          #   QA_CONTRACT_RULESET  vacuum's ruleset, or empty
          #   QA_VACUUM_VERSION, QA_ASYNCAPI_VERSION   for the claim lines
          #   PR_LABELS            the pull request's labels as a JSON array
          # Before any tool runs, a `$ref` that does not start with `#` refuses: the
          # tools would read other files or the network. The base is the merge commit's
          # first parent, read from the checkout's object store.
          set -euo pipefail

          out=${QA_OUT:-${RUNNER_TEMP:?RUNNER_TEMP is not set}/qa/contracts}
          mkdir -p "$out"

          fail() {
            printf '::error::qa-contracts: %s\n' "$1"
            exit 1
          }

          # `<file>:<line> has an external $ref (<value>)` for the first `$ref` whose
          # value does not start with `#`, YAML `$ref:` and JSON `"$ref":` alike.
          external_ref() {
            awk -v file="$1" '
              {
                line = $0
                while (match(line, /"?\$ref"?[[:space:]]*:[[:space:]]*/)) {
                  rest = substr(line, RSTART + RLENGTH)
                  quote = substr(rest, 1, 1)
                  if (quote == "\"" || quote == "\047") {
                    rest = substr(rest, 2)
                    value = substr(rest, 1, index(rest, quote) - 1)
                  } else {
                    match(rest, /^[^,}[:space:]]*/)
                    value = substr(rest, 1, RLENGTH)
                  }
                  if (substr(value, 1, 1) != "#") {
                    printf "%s:%d has an external $ref (%s)\n", file, NR, value
                    exit
                  }
                  line = rest
                }
              }' "$1"
          }

          # The comma-separated lists as arrays.
          IFS=, read -r -a openapi <<< "${QA_OPENAPI:-}"
          IFS=, read -r -a asyncapi <<< "${QA_ASYNCAPI:-}"
          IFS=, read -r -a published <<< "${QA_PUBLISHED:-}"

          # The declared published copy of live contract `$1`, or nothing.
          published_of() {
            local pair
            for pair in ${published[@]+"${published[@]}"}; do
              if [ "${pair%%=*}" = "$1" ]; then
                printf '%s\n' "${pair#*=}"
                return 0
              fi
            done
          }

          # `$out/<dir>/<contract>.<ext>`, its directory created.
          report_of() {
            mkdir -p "$out/$1/$(dirname "$2")"
            printf '%s\n' "$out/$1/$2.$3"
          }

          for contract in ${openapi[@]+"${openapi[@]}"} ${asyncapi[@]+"${asyncapi[@]}"}; do
            found=$(external_ref "$contract")
            [ -z "$found" ] || fail "$found; bundle the contract into one file (docs/agent-setup/qa.md)"
            copy=$(published_of "$contract")
            if [ -n "$copy" ]; then
              found=$(external_ref "$copy")
              [ -z "$found" ] || fail "$found; bundle the contract into one file (docs/agent-setup/qa.md)"
            fi
          done

          lint() {
            for contract in ${openapi[@]+"${openapi[@]}"}; do
              args=(lint --details --no-style --no-banner --no-update-check --remote=false --fail-severity error)
              [ -z "${QA_CONTRACT_RULESET:-}" ] || args+=(--ruleset "$QA_CONTRACT_RULESET")
              if vacuum "${args[@]}" "$contract" 2>&1 | tee "$(report_of vacuum-lint "$contract" txt)"; then
                printf 'contract-lint: %s ok (vacuum %s)\n' "$contract" "${QA_VACUUM_VERSION:-}"
              else
                fail "$contract fails lint (vacuum); see the report artifact"
              fi
            done
            for contract in ${asyncapi[@]+"${asyncapi[@]}"}; do
              if asyncapi validate "$contract" --fail-severity error 2>&1 | tee "$(report_of asyncapi-validate "$contract" txt)"; then
                printf 'contract-lint: %s ok (asyncapi %s)\n' "$contract" "${QA_ASYNCAPI_VERSION:-}"
