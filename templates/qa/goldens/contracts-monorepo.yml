            tgz)
              mkdir "$tmp/extract"
              tar -xzf "$file" -C "$tmp/extract"
              member="$tmp/extract/$TOOL_BIN"
              if [ -n "$bin_path" ]; then
                archive_member "$tmp/extract"
              elif [ ! -f "$member" ]; then
                fail "($arch) archive has no $TOOL_BIN at its root"
              fi
