name: Security (brakes)
# Generated by brakes ci-baseline 1.0.0 from .agent-setup/project.json and
# .agent-setup/modules/ci-baseline.json. Edit those and re-run the installer; a hand
# edit here is refused as a conflict. Commands are read at run time, never invented.
# Pinned by SHA; when GitHub's workflow lockfile leaves preview, `gh actions-lock`
# supersedes these pins (decision pending).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    name: scope
    runs-on: example-cloud-2
    timeout-minutes: 5
    outputs:
      tier: "${{ steps.scope.outputs.tier }}"
      skippable: "${{ steps.scope.outputs.skippable }}"
      protected: "${{ steps.scope.outputs.protected }}"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          persist-credentials: "false"
      - id: scope
        name: Decide the tier and the skippable jobs
        env:
          APPS: ""
          BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          DOCS_SKIPPABLE: |-
            heldout
            heldout-properties
          EVENT: "${{ github.event_name }}"
          HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
          INERT_PATHS: |-
            docs/**
            tasks/**
            **/*.md
          PROTECTED_PATHS: |-
            .github/workflows/**
            .github/rulesets/**
            .github/CODEOWNERS
            .agent-setup/project.json
            tests/heldout/**
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          : "${GITHUB_OUTPUT:?GITHUB_OUTPUT is not set}"
          event=${EVENT:-}
          inert_paths=${INERT_PATHS:-}
          docs_skippable=${DOCS_SKIPPABLE:-}
          apps=${APPS:-}
          protected_paths=${PROTECTED_PATHS:-}

          emit() {
            printf '%s=%s\n' "$1" "$2" | tee -a "$GITHUB_OUTPUT"
          }

          tier=full
          diffed=false
          listed=false
          files=""
          if [ "$event" = pull_request ] && [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ] \
            && files="$(git -c diff.renames=false -c core.quotePath=false diff --name-only "$BASE_SHA...$HEAD_SHA")"; then
            diffed=true
            [ -z "$files" ] || listed=true
          fi

          matches() {
            local glob
            while IFS= read -r glob; do
              case "$glob" in '' | '!'*) continue ;; esac
              # shellcheck disable=SC2254 # the glob must stay unquoted to act as a pattern
              case "$1" in $glob | ${glob#"**/"}) return 0 ;; esac
            done <<< "$2"
            return 1
          }

          negated=""
          while IFS= read -r glob; do
            case "$glob" in '!'*) negated="$negated $glob" ;; esac
          done <<< "$inert_paths"
          if [ -n "$negated" ]; then
            echo "::warning::inert_paths carries a negation (${negated# }); negations are never evaluated, tier stays full"
          fi

          is_inert() {
            case "$1" in .github/workflows/*) return 1 ;; esac
            if matches "$1" "$protected_paths"; then
              return 1
            fi
            matches "$1" "$inert_paths"
          }

          if $listed && [ -z "$negated" ]; then
            tier=docs
            while IFS= read -r file; do
              if ! is_inert "$file"; then
                tier=full
                break
              fi
            done <<< "$files"
          fi

          ids=""
          add() {
            case $'\n'"$ids" in *$'\n'"$1"$'\n'*) return 0 ;; esac
            ids="$ids$1"$'\n'
          }

          if [ "$event" = pull_request ]; then
            if $listed; then
              if [ "$tier" = docs ]; then
                while IFS= read -r id; do
                  [ -n "$id" ] && add "$id"
                done <<< "$docs_skippable"
              fi
              workflow=false
              while IFS= read -r file; do
                case "$file" in .github/*) workflow=true ;; esac
              done <<< "$files"
              if ! $workflow; then
                add workflow-lint
              fi
            fi
          fi
          if [ "$event" != push ]; then
            add macos
          fi

          changed_apps=""
          outside=false
          if $listed; then
            while IFS= read -r file; do
              owner=""
              while IFS= read -r app; do
                [ -n "$app" ] || continue
                id=${app%%=*}
                path=${app#*=}
                path=${path%/}
                case "$file" in "$path"/*) owner=$id; changed_apps="$changed_apps $id " ;; esac
              done <<< "$apps"
              if [ -z "$owner" ]; then
                outside=true
              fi
            done <<< "$files"
          fi

          flags=""
          while IFS= read -r app; do
            [ -n "$app" ] || continue
            id=${app%%=*}
            changed=true
            if $listed && ! $outside; then
              case "$changed_apps" in *" $id "*) ;; *) changed=false; add "$id-checks" ;; esac
            fi
            flags="$flags$id=$changed"$'\n'
          done <<< "$apps"

          skippable="$(printf '%s' "$ids" | jq -R . | jq -cs .)"

          negated=""
          while IFS= read -r glob; do
            case "$glob" in '!'*) negated="$negated $glob" ;; esac
          done <<< "$protected_paths"
          if [ -n "$negated" ]; then
            echo "::warning::protected_paths carries a negation (${negated# }); negations are never evaluated and protect nothing less"
          fi
          pin_re='^([[:space:]]*(- )?use[s]:[[:space:]]*)([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)(/[A-Za-z0-9_./-]+)?@([0-9a-f]{40})[[:space:]]+#[[:space:]]*([A-Za-z0-9_.+-]+)[[:space:]]*$'

          is_tag_commit() {
            local refs sha ref direct="" peeled=""
            refs="$(GIT_TERMINAL_PROMPT=0 git ls-remote --tags "https://github.com/$1" "refs/tags/$2" "refs/tags/$2^{}" 2>/dev/null)" || return 1
            while IFS=$'\t' read -r sha ref; do
              [ "$ref" = "refs/tags/$2" ] && direct=$sha
              [ "$ref" = "refs/tags/$2^{}" ] && peeled=$sha
            done <<< "$refs"
            [ -z "$peeled" ] || direct=$peeled
            [ -n "$direct" ] && [ "$direct" = "$3" ]
          }

          is_pin_pair() {
            local prefix action
            [[ $1 =~ $pin_re ]] || return 1
            prefix=${BASH_REMATCH[1]}
            action=${BASH_REMATCH[3]}${BASH_REMATCH[4]}
            [[ $2 =~ $pin_re ]] || return 1
            [ "${BASH_REMATCH[1]}" = "$prefix" ] || return 1
            [ "${BASH_REMATCH[3]}${BASH_REMATCH[4]}" = "$action" ] || return 1
            is_tag_commit "${BASH_REMATCH[3]}" "${BASH_REMATCH[6]}" "${BASH_REMATCH[5]}"
          }

          is_pin_bump() {
            local diff line pending="" old hunk=false
            diff="$(git -c diff.renames=false -c core.quotePath=false diff -U0 --no-color --no-ext-diff "$BASE_SHA...$HEAD_SHA" -- "$1")" || return 1
            [ -n "$diff" ] || return 1
            while IFS= read -r line; do
              if ! $hunk; then
                case "$line" in
                  'diff --git '* | 'index '* | '--- a/'* | '+++ b/'*) continue ;;
                  '@@ '*) hunk=true; continue ;;
                  *) return 1 ;;
                esac
              fi
              case "$line" in
                '@@ '*) [ -z "$pending" ] || return 1 ;;
                -*) pending="$pending${line#-}"$'\n' ;;
                +*)
                  [ -n "$pending" ] || return 1
                  old=${pending%%$'\n'*}
                  pending=${pending#*$'\n'}
                  is_pin_pair "$old" "${line#+}" || return 1
                  ;;
                *) return 1 ;;
              esac
            done <<< "$diff"
            $hunk && [ -z "$pending" ]
          }

          changed_protected=""
          if [ "$event" = pull_request ] && ! $diffed; then
            changed_protected='<unknown>'$'\n'
          elif $listed; then
            while IFS= read -r file; do
              if matches "$file" "$protected_paths" && ! is_pin_bump "$file"; then
                changed_protected="$changed_protected$file"$'\n'
              fi
            done <<< "$files"
          fi
          protected="$(printf '%s' "$changed_protected" | jq -R . | jq -cs .)"

          emit tier "$tier"
          emit skippable "$skippable"
          emit protected "$protected"
          while IFS= read -r flag; do
            [ -n "$flag" ] || continue
            emit "changed-${flag%%=*}" "${flag#*=}"
          done <<< "$flags"
  heldout:
    name: heldout
    needs: scope
    if: needs.scope.outputs.tier != 'docs'
    runs-on: example-cloud-2
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          components: "clippy, rustfmt"
          toolchain: "1.99"
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: "${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}"
          workspaces: "."
      - name: Run held-out tests
        env:
          HELDOUT_COMMAND: python3 -m unittest discover -s tests/heldout -v
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          : "${HELDOUT_COMMAND:?HELDOUT_COMMAND is not set}"
          echo "heldout: $HELDOUT_COMMAND"
          bash -euo pipefail -c "$HELDOUT_COMMAND"
  heldout-properties:
    name: heldout-properties
    needs: scope
    if: needs.scope.outputs.tier != 'docs'
    runs-on: example-cloud-2
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          components: "clippy, rustfmt"
          toolchain: "1.99"
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: "${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}"
          workspaces: "."
      - id: seed
        name: Draw the held-out seed
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          : "${GITHUB_OUTPUT:?GITHUB_OUTPUT is not set}"
          seed="$(od -An -N4 -tu4 /dev/urandom | tr -d ' \n')"
          [[ "$seed" =~ ^[0-9]+$ ]] || { echo "heldout-seed: no seed drawn from /dev/urandom" >&2; exit 1; }
          echo "seed: $seed"
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            printf 'Held-out properties\n\nseed: %s\n\nReplay a failure locally with HELDOUT_SEED=%s and the same command.\n' "$seed" "$seed" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run held-out properties
        env:
          HELDOUT_EXAMPLES: "200"
          HELDOUT_PROPERTIES_COMMAND: cargo test --locked --test heldout_properties
          HELDOUT_SEED: "${{ steps.seed.outputs.seed }}"
          PROPTEST_CASES: "200"
          PROPTEST_RNG_SEED: "${{ steps.seed.outputs.seed }}"
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          : "${HELDOUT_PROPERTIES_COMMAND:?HELDOUT_PROPERTIES_COMMAND is not set}"
          : "${HELDOUT_SEED:?HELDOUT_SEED is not set}"
          : "${HELDOUT_EXAMPLES:?HELDOUT_EXAMPLES is not set}"
          echo "heldout-properties: seed $HELDOUT_SEED, at least $HELDOUT_EXAMPLES examples: $HELDOUT_PROPERTIES_COMMAND"
          status=0
          bash -euo pipefail -c "$HELDOUT_PROPERTIES_COMMAND" || status=$?
          if (( status != 0 )); then
            echo "heldout-properties: failed; replay with HELDOUT_SEED=$HELDOUT_SEED HELDOUT_EXAMPLES=$HELDOUT_EXAMPLES and the same command"
            exit "$status"
          fi
      - name: Upload persisted property failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: ignore
          name: heldout-properties-failures
          path: |
            **/proptest-regressions/
            **/*.proptest-regressions
          retention-days: "7"
  agentic-required:
    name: agentic-required
    needs: [scope, heldout, heldout-properties]
    if: always()
    permissions:
      issues: read
      pull-requests: read
    runs-on: example-cloud-2
    timeout-minutes: 5
    steps:
      - name: Decide the required check
        env:
          EVENT: "${{ github.event_name }}"
          EVENT_ACTION: "${{ github.event.action }}"
          EVENT_LABEL: "${{ github.event.label.name }}"
          GH_TOKEN: "${{ github.token }}"
          NEEDS: "${{ toJSON(needs) }}"
          PROTECTED: "${{ needs.scope.outputs.protected }}"
          PR_LABELS: "${{ toJSON(github.event.pull_request.labels.*.name) }}"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
          REPOSITORY: "${{ github.repository }}"
          SCOPE: "${{ needs.scope.result }}"
          SENDER_LOGIN: "${{ github.event.sender.login }}"
          SENDER_TYPE: "${{ github.event.sender.type }}"
          SKIPPABLE: "${{ needs.scope.outputs.skippable }}"
          TIER: "${{ needs.scope.outputs.tier }}"
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # shellcheck disable=SC2016 # a jq program: its $names are jq variables.
          VERDICT='def verdict($login; $type; $app):
            [ (if $type == "User" and $login != "" and ($login | endswith("[bot]") | not) and $app == null
               then "person" else "other" end),
              ($login | gsub("[^A-Za-z0-9\\[\\]-]"; "") | if . == "" then "-" else . end),
              ($type | gsub("[^A-Za-z]"; "") | if . == "" then "-" else . end),
              (if $app == null then "" else ", via an App" end) ] | @tsv;'

          if [ "${SCOPE:-}" != success ]; then
            printf '::error::scope did not run; refusing to pass (scope result: %s)\n' "${SCOPE:-missing}"
            exit 1
          fi
          case "${TIER:-}" in
            full | docs) ;;
            *)
              printf "::error::scope did not decide a tier (tier: '%s')\\n" "${TIER:-}"
              exit 1
              ;;
          esac
          if [ "${EVENT:-}" = pull_request ]; then
            if ! protected="$(printf '%s' "${PROTECTED:-}" | jq -er 'if type == "array" and all(type == "string") then (if index("<unknown>") != null then "<unknown>" else join(", ") end) else error("unreadable") end' 2>/dev/null)"; then
              protected='<unknown>'
            fi
            approved=false
            if printf '%s' "${PR_LABELS:-}" | jq -e 'type == "array" and index("human-approved") != null' >/dev/null 2>&1; then
              approved=true
            fi
            if $approved; then
              tab="$(printf '\t')"
              refuse_actor() {
                printf '::error::Label human-approved was last added by %s (%s)%s, not by a person; a person must remove it and add it again\n' "$2" "$3" "$4"
                exit 1
              }
              if [ "${EVENT_ACTION:-}" = labeled ] &&
                [ "$(printf '%s' "${EVENT_LABEL:-}" | tr '[:upper:]' '[:lower:]')" = human-approved ]; then
                sender="$(jq -nr --arg l "${SENDER_LOGIN:-}" --arg t "${SENDER_TYPE:-}" "$VERDICT"' verdict($l; $t; null)')"
                IFS="$tab" read -r kind login type via <<EOF
          $sender
          EOF
                [ "$kind" = person ] || refuse_actor "$kind" "$login" "$type" "$via"
              fi
              last=''
              if [ -n "${PR_NUMBER:-}" ] && [ -n "${REPOSITORY:-}" ] &&
                events="$(gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/events?per_page=100" 2>/dev/null)"; then
                last="$(printf '%s' "$events" | jq -ser "$VERDICT"'
                  if length > 0 and all(.[]; type == "array") and all(.[][]; type == "object") then
                    [ .[][] | select(.event == "labeled" and ((.label.name // "") | ascii_downcase) == "human-approved") ]
                    | sort_by([(.created_at // ""), (.id // 0)])
                    | if length == 0 then "none"
                      else last | verdict((.actor.login // "") | tostring; (.actor.type // "") | tostring; .performed_via_github_app)
                      end
                  else error("unreadable") end' 2>/dev/null)" || last=''
              fi
              if [ -z "$last" ]; then
                printf '::error::Could not read who added the label human-approved; refusing to pass\n'
                exit 1
              fi
              if [ "$last" = none ]; then
                printf '::error::No labeled event for human-approved was found; refusing to pass\n'
                exit 1
              fi
              IFS="$tab" read -r kind login type via <<EOF
          $last
          EOF
              [ "$kind" = person ] || refuse_actor "$kind" "$login" "$type" "$via"
            fi
            if [ -z "$protected" ] && $approved; then
              printf 'protected: none (label human-approved added by %s)\n' "$login"
            elif [ -z "$protected" ]; then
              printf 'protected: none\n'
            elif $approved; then
              printf 'protected: %s (label human-approved added by %s)\n' "$protected" "$login"
            elif [ "$protected" = '<unknown>' ]; then
              printf '::error::Protected paths could not be computed; refusing to pass\n'
              exit 1
            else
              printf '::error::Protected path changed without human approval: %s\n' "$protected"
              exit 1
            fi
          fi
          if ! printf '%s' "${SKIPPABLE:-}" | jq -e 'type == "array" and all(type == "string")' >/dev/null 2>&1; then
            printf "::error::scope did not list skippable jobs as a JSON array of job ids (skippable: '%s')\\n" "${SKIPPABLE:-}"
            exit 1
          fi
          if ! printf '%s' "${NEEDS:-}" | jq -e 'type == "object"' >/dev/null 2>&1; then
            printf '::error::needs is not a JSON object; refusing to pass\n'
            exit 1
          fi

          verdicts="$(printf '%s' "$NEEDS" | jq -r --argjson skippable "$SKIPPABLE" '
            to_entries
            | map(select(.key != "scope"))
            | .[]
            | .key as $id
            | [ $id,
                ((.value | objects | .result | strings) // "missing"),
                (if ($skippable | index($id)) != null then "listed" else "unlisted" end) ]
            | @tsv')"
          if [ -z "$verdicts" ]; then
            printf '::error::needs lists no job besides scope; refusing to pass\n'
            exit 1
          fi

          total=0
          failed=0
          while IFS="$(printf '\t')" read -r job result listed; do
            total=$((total + 1))
            case "$result" in
              success)
                printf '%s: success\n' "$job"
                ;;
              skipped)
                if [ "$listed" = listed ]; then
                  printf '%s: skipped on purpose (listed as skippable under tier %s)\n' "$job" "$TIER"
                else
                  printf '::error::%s: skipped, but scope did not list it as skippable under tier %s\n' "$job" "$TIER"
                  failed=$((failed + 1))
                fi
                ;;
              missing)
                printf '::error::%s: no result in needs\n' "$job"
                failed=$((failed + 1))
                ;;
              *)
                printf '::error::%s: %s\n' "$job" "$result"
                failed=$((failed + 1))
                ;;
            esac
          done <<EOF
          $verdicts
          EOF

          if [ "$failed" -ne 0 ]; then
            printf 'required: %s of %s jobs did not pass under tier %s; refusing to pass\n' "$failed" "$total" "$TIER"
            exit 1
          fi
          printf 'required: %s jobs passed under tier %s\n' "$total" "$TIER"
