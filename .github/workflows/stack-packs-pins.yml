# brakes stack-packs: action pins for Dependabot's `github-actions` ecosystem.
# Never runs (manual trigger only, every job gated off by a condition that trigger
# makes false; actionlint refuses a constant `if: false`). One `uses:` per action of
# templates/stack-packs/pins.json that no other workflow here uses; the pins test
# (orchestration/installer/tests/stack_packs_pins.rs) fails until a bump here is
# copied into pins.json with a new `last_verified`.
name: Stack-pack pins
on:
  workflow_dispatch:
permissions: {}
jobs:
  pins:
    name: pins (never runs)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pins
          key: pins
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pins
          key: pins
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
  # The agent actions sit in a job of their own, as agents.workflow-injection asks
  # of any job that names one (#972): no cache step, `cache-mode: none`, Codex last;
  # agents.workflow-caps (#750) asks for a concurrency group and --max-turns.
  agent-pins:
    name: agent pins (never runs)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    cache-mode: none
    concurrency: agent-pins
    steps:
      - uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          claude_args: --max-turns 1
      - uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
