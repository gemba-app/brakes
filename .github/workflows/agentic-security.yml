      - name: Scan with Semgrep CE 1.182.0
        if: steps.bypass.outputs.id == ''
        env:
          SEMGREP_IMAGE: "docker.io/semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af"
        run: |
          docker run --rm -v "$PWD:/src" "$SEMGREP_IMAGE" semgrep --version
          status=0
          docker run --rm -v "$PWD:/src" "$SEMGREP_IMAGE" semgrep scan --metrics=off --error --quiet --json --output semgrep.json --severity ERROR --config p/default --config p/rust || status=$?
          set -- semgrep semgrep.json "$status"
          #!/usr/bin/env bash
          set -euo pipefail

          scanner="$1"
          report="$2"
          status="$3"

          if ! jq -e 'type == "object"' "$report" > /dev/null 2>&1; then
            echo "::error::$scanner wrote no readable report (exit $status)"
            if [ "$status" -eq 0 ]; then
              exit 1
            fi
            exit "$status"
          fi

          case "$scanner" in
            semgrep)
              findings='[.results[]? | [.check_id, .path, .start.line]]'
              errors='[.errors[]? | [(.type | if type == "array" then .[0] else . end), (.path // "no path")]]'
