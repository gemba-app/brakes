name: Security (brakes)
# Generated by brakes ci-baseline 1.0.0 from .agent-setup/project.json and
# .agent-setup/modules/ci-baseline.json. Edit those and re-run the installer; a hand
# edit here is refused as a conflict. Commands are read at run time, never invented.
# Pinned by SHA; when GitHub's workflow lockfile leaves preview, `gh actions-lock`
# supersedes these pins (decision pending).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    name: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tier: "${{ steps.scope.outputs.tier }}"
      skippable: "${{ steps.scope.outputs.skippable }}"
      protected: "${{ steps.scope.outputs.protected }}"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          persist-credentials: "false"
      - id: scope
        name: Decide the tier and the skippable jobs
        env:
          APPS: ""
          BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          DOCS_SKIPPABLE: |-
            heldout
            deps-scan
            sast
          EVENT: "${{ github.event_name }}"
          HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
          INERT_PATHS: |-
            docs/**
            tasks/**
            **/*.md
          PROTECTED_PATHS: |-
            .github/workflows/**
            .github/rulesets/**
            .github/CODEOWNERS
            .agent-setup/project.json
            tests/heldout/**
          REPOSITORY_OWNER: "${{ github.repository_owner }}"
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          : "${GITHUB_OUTPUT:?GITHUB_OUTPUT is not set}"
          event=${EVENT:-}
          inert_paths=${INERT_PATHS:-}
          docs_skippable=${DOCS_SKIPPABLE:-}
          apps=${APPS:-}
          protected_paths=${PROTECTED_PATHS:-}

          emit() {
            printf '%s=%s\n' "$1" "$2" | tee -a "$GITHUB_OUTPUT"
          }

          tier=full
          diffed=false
          listed=false
          files=""
          if [ "$event" = pull_request ] && [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ] \
            && files="$(git -c diff.renames=false -c core.quotePath=false diff --name-only "$BASE_SHA...$HEAD_SHA")"; then
            diffed=true
            [ -z "$files" ] || listed=true
          fi

          matches() {
            local glob
            while IFS= read -r glob; do
              case "$glob" in '' | '!'*) continue ;; esac
              # shellcheck disable=SC2254 # the glob must stay unquoted to act as a pattern
              case "$1" in $glob | ${glob#"**/"}) return 0 ;; esac
            done <<< "$2"
            return 1
          }

          negated=""
          while IFS= read -r glob; do
            case "$glob" in '!'*) negated="$negated $glob" ;; esac
          done <<< "$inert_paths"
          if [ -n "$negated" ]; then
            echo "::warning::inert_paths carries a negation (${negated# }); negations are never evaluated, tier stays full"
          fi

          is_inert() {
            case "$1" in .github/workflows/*) return 1 ;; esac
            if matches "$1" "$protected_paths"; then
              return 1
            fi
            matches "$1" "$inert_paths"
          }

          if $listed && [ -z "$negated" ]; then
            tier=docs
            while IFS= read -r file; do
              if ! is_inert "$file"; then
                tier=full
                break
              fi
            done <<< "$files"
          fi

          ids=""
          add() {
            case $'\n'"$ids" in *$'\n'"$1"$'\n'*) return 0 ;; esac
            ids="$ids$1"$'\n'
          }

          if [ "$event" = pull_request ]; then
            if $listed; then
              if [ "$tier" = docs ]; then
                while IFS= read -r id; do
                  [ -n "$id" ] && add "$id"
                done <<< "$docs_skippable"
              fi
              workflow=false
              while IFS= read -r file; do
                case "$file" in .github/*) workflow=true ;; esac
              done <<< "$files"
              if ! $workflow; then
                add workflow-lint
              fi
            fi
          fi
          if [ "$event" != push ]; then
            add macos
          fi

          changed_apps=""
          outside=false
          if $listed; then
            while IFS= read -r file; do
              owner=""
              while IFS= read -r app; do
                [ -n "$app" ] || continue
                id=${app%%=*}
                path=${app#*=}
                path=${path%/}
                case "$file" in "$path"/*) owner=$id; changed_apps="$changed_apps $id " ;; esac
              done <<< "$apps"
              if [ -z "$owner" ]; then
                outside=true
              fi
            done <<< "$files"
          fi

          flags=""
          while IFS= read -r app; do
            [ -n "$app" ] || continue
            id=${app%%=*}
            changed=true
            if $listed && ! $outside; then
              case "$changed_apps" in *" $id "*) ;; *) changed=false; add "$id-checks" ;; esac
            fi
            flags="$flags$id=$changed"$'\n'
          done <<< "$apps"

          skippable="$(printf '%s' "$ids" | jq -R . | jq -cs .)"

          negated=""
          while IFS= read -r glob; do
            case "$glob" in '!'*) negated="$negated $glob" ;; esac
          done <<< "$protected_paths"
          if [ -n "$negated" ]; then
            echo "::warning::protected_paths carries a negation (${negated# }); negations are never evaluated and protect nothing less"
          fi
          pin_re='^( *(- )?use[s]: *)([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)(/[A-Za-z0-9_./-]+)?@([0-9a-f]{40}) +# *(v?[0-9]{1,9}(\.[0-9]{1,9})*) *$'

          is_tag_commit() {
            local refs sha ref direct="" peeled=""
            refs="$(GIT_TERMINAL_PROMPT=0 git ls-remote --tags "https://github.com/$1" "refs/tags/$2" "refs/tags/$2^{}" 2>/dev/null)" || return 1
            while IFS=$'\t' read -r sha ref; do
              [ "$ref" = "refs/tags/$2" ] && direct=$sha
              [ "$ref" = "refs/tags/$2^{}" ] && peeled=$sha
            done <<< "$refs"
            [ -z "$peeled" ] || direct=$peeled
            [ -n "$direct" ] && [ "$direct" = "$3" ]
          }

          is_newer_release() {
            local new=${1#v} old=${2#v} a b
            while [ -n "$new" ] || [ -n "$old" ]; do
              a=${new%%.*}
              b=${old%%.*}
              a=$((10#${a:-0}))
              b=$((10#${b:-0}))
              [ "$a" -gt "$b" ] && return 0
              [ "$a" -lt "$b" ] && return 1
              case "$new" in *.*) new=${new#*.} ;; *) new="" ;; esac
              case "$old" in *.*) old=${old#*.} ;; *) old="" ;; esac
            done
            return 1
          }

          is_pin_pair() {
            local LC_ALL=C prefix action old_tag owner self
            [ -n "${REPOSITORY_OWNER:-}" ] || return 1
            [[ $1 =~ $pin_re ]] || return 1
            prefix=${BASH_REMATCH[1]}
            action=${BASH_REMATCH[3]}${BASH_REMATCH[4]}
            old_tag=${BASH_REMATCH[6]}
            [[ $2 =~ $pin_re ]] || return 1
            [ "${BASH_REMATCH[1]}" = "$prefix" ] || return 1
            [ "${BASH_REMATCH[3]}${BASH_REMATCH[4]}" = "$action" ] || return 1
            owner="$(printf '%s' "${action%%/*}" | tr '[:upper:]' '[:lower:]')"
            self="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
            [ "$owner" != "$self" ] || return 1
            is_newer_release "${BASH_REMATCH[6]}" "$old_tag" || return 1
            is_tag_commit "${BASH_REMATCH[3]}" "${BASH_REMATCH[6]}" "${BASH_REMATCH[5]}"
          }

          is_pin_bump() {
            local diff line pending="" old hunk=false
            diff="$(git -c diff.renames=false -c core.quotePath=false diff -U0 --no-color --no-ext-diff "$BASE_SHA...$HEAD_SHA" -- "$1")" || return 1
            [ -n "$diff" ] || return 1
            while IFS= read -r line; do
              if ! $hunk; then
                case "$line" in
                  'diff --git '* | 'index '* | '--- a/'* | '+++ b/'*) continue ;;
                  '@@ '*) hunk=true; continue ;;
                  *) return 1 ;;
                esac
              fi
              case "$line" in
                '@@ '*) [ -z "$pending" ] || return 1 ;;
                -*) pending="$pending${line#-}"$'\n' ;;
                +*)
                  [ -n "$pending" ] || return 1
                  old=${pending%%$'\n'*}
                  pending=${pending#*$'\n'}
                  is_pin_pair "$old" "${line#+}" || return 1
                  ;;
                *) return 1 ;;
              esac
            done <<< "$diff"
            $hunk && [ -z "$pending" ]
          }

          changed_protected=""
          if [ "$event" = pull_request ] && ! $diffed; then
            changed_protected='<unknown>'$'\n'
          elif $listed; then
            while IFS= read -r file; do
              if matches "$file" "$protected_paths" && ! is_pin_bump "$file"; then
                changed_protected="$changed_protected$file"$'\n'
              fi
            done <<< "$files"
          fi
          protected="$(printf '%s' "$changed_protected" | jq -R . | jq -cs .)"

          emit tier "$tier"
          emit skippable "$skippable"
          emit protected "$protected"
          while IFS= read -r flag; do
            [ -n "$flag" ] || continue
            emit "changed-${flag%%=*}" "${flag#*=}"
          done <<< "$flags"
  heldout:
    name: heldout
    needs: scope
    if: needs.scope.outputs.tier != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Check held-out tests are pending
        env:
          HELDOUT_DIR: tests/heldout
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          : "${HELDOUT_DIR:?HELDOUT_DIR is not set}"
          files=""
          if [ -e "$HELDOUT_DIR" ]; then
            files="$(find "$HELDOUT_DIR" ! -type d | LC_ALL=C sort)"
          fi
          if [ -n "$files" ]; then
            echo "heldout: $HELDOUT_DIR holds tests and heldout_command is not answered; answer it so the job runs them"
            printf '%s\n' "$files"
            exit 1
          fi
          echo "heldout: no held-out tests yet under $HELDOUT_DIR; answer heldout_command when the first one lands"
  workflow-lint:
    name: workflow-lint
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.skippable), 'workflow-lint') == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Install actionlint
        env:
          TOOL_BIN: actionlint
          TOOL_FORMAT: tgz
          TOOL_NAME: actionlint
          TOOL_SHA256_AMD64: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          TOOL_SHA256_ARM64: "325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6"
          TOOL_URL_AMD64: "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          TOOL_URL_ARM64: "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_arm64.tar.gz"
          TOOL_VERSION: "1.7.12"
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          for name in TOOL_NAME TOOL_VERSION TOOL_BIN TOOL_FORMAT \
            TOOL_URL_AMD64 TOOL_SHA256_AMD64 TOOL_URL_ARM64 TOOL_SHA256_ARM64; do
            if [ -z "${!name:-}" ]; then
              echo "::error::security: install-tool.sh needs $name"
              exit 1
            fi
          done

          fail() {
            echo "::error::security: $TOOL_NAME $TOOL_VERSION $*"
            exit 1
          }

          digest() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | cut -d' ' -f1
            else
              shasum -a 256 "$1" | cut -d' ' -f1
            fi
          }

          case "$TOOL_FORMAT" in
            tgz | bin) ;;
            *) fail "unknown format $TOOL_FORMAT" ;;
          esac

          bin_path="${TOOL_BIN_PATH:-}"
          if [ -n "$bin_path" ]; then
            if [ "$TOOL_FORMAT" != tgz ]; then
              fail "TOOL_BIN_PATH needs format tgz, got $TOOL_FORMAT"
            fi
            case "/$bin_path/" in
              //* | */../*) fail "TOOL_BIN_PATH $bin_path must be relative to the archive root without .." ;;
            esac
          fi

          archive_member() {
            local root dir found
            local matches=()
            root="$(cd -P "$1" && pwd -P)"
            while IFS= read -r found; do
              matches+=("$found")
            done < <(compgen -G "$1/$bin_path")
            if [ "${#matches[@]}" -ne 1 ]; then
              fail "($arch) TOOL_BIN_PATH $bin_path matches ${#matches[@]} files in the archive; exactly one is required"
            fi
            if [ -L "${matches[0]}" ] || [ ! -f "${matches[0]}" ]; then
              fail "($arch) TOOL_BIN_PATH $bin_path is not a regular file inside the archive"
            fi
            dir="$(cd -P "$(dirname "${matches[0]}")" && pwd -P)"
            case "$dir/" in
              "$root"/*) ;;
              *) fail "($arch) TOOL_BIN_PATH $bin_path is not a regular file inside the archive" ;;
            esac
            member="${matches[0]}"
          }

          machine="$(uname -m)"
          case "$machine" in
            x86_64 | amd64)
              arch=amd64
              url="$TOOL_URL_AMD64"
              expected="$TOOL_SHA256_AMD64"
              ;;
            aarch64 | arm64)
              arch=arm64
              url="$TOOL_URL_ARM64"
              expected="$TOOL_SHA256_ARM64"
              ;;
            *) fail "has no pin for architecture $machine" ;;
          esac

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          file="$tmp/$TOOL_NAME-$arch.download"

          echo "install: $TOOL_NAME $TOOL_VERSION $arch from $url"
          if ! curl -fsSL --retry 3 -o "$file" "$url"; then
            fail "($arch) download failed: $url"
          fi

          actual="$(digest "$file")"
          if [ "$actual" != "$expected" ]; then
            fail "($arch) checksum mismatch: expected $expected, got $actual; nothing was installed"
          fi

          bin_dir="${TOOL_BIN_DIR:-${RUNNER_TEMP:-$PWD}/brakes-bin}"
          mkdir -p "$bin_dir"
          case "$TOOL_FORMAT" in
            tgz)
              mkdir "$tmp/extract"
              tar -xzf "$file" -C "$tmp/extract"
              member="$tmp/extract/$TOOL_BIN"
              if [ -n "$bin_path" ]; then
                archive_member "$tmp/extract"
              elif [ ! -f "$member" ]; then
                fail "($arch) archive has no $TOOL_BIN at its root"
              fi
              install -m 0755 "$member" "$bin_dir/$TOOL_BIN"
              ;;
            bin)
              install -m 0755 "$file" "$bin_dir/$TOOL_BIN"
              ;;
          esac

          if [ -n "${GITHUB_PATH:-}" ]; then
            echo "$bin_dir" >>"$GITHUB_PATH"
          fi
          echo "tool: $TOOL_NAME $TOOL_VERSION sha256=$actual"
      - name: Lint workflows with actionlint
        run: actionlint
      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: "false"
          annotations: "true"
          min-severity: medium
          persona: regular
          version: "1.31.1"
  security-gate:
    name: security-gate
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          persist-credentials: "false"
      - name: Install gitleaks
        env:
          TOOL_BIN: "gitleaks"
          TOOL_FORMAT: "tgz"
          TOOL_NAME: "gitleaks"
          TOOL_SHA256_AMD64: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          TOOL_SHA256_ARM64: "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"
          TOOL_URL_AMD64: "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          TOOL_URL_ARM64: "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_arm64.tar.gz"
          TOOL_VERSION: "8.30.1"
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          for name in TOOL_NAME TOOL_VERSION TOOL_BIN TOOL_FORMAT \
            TOOL_URL_AMD64 TOOL_SHA256_AMD64 TOOL_URL_ARM64 TOOL_SHA256_ARM64; do
            if [ -z "${!name:-}" ]; then
              echo "::error::security: install-tool.sh needs $name"
              exit 1
            fi
          done

          fail() {
            echo "::error::security: $TOOL_NAME $TOOL_VERSION $*"
            exit 1
          }

          digest() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | cut -d' ' -f1
            else
              shasum -a 256 "$1" | cut -d' ' -f1
            fi
          }

          case "$TOOL_FORMAT" in
            tgz | bin) ;;
            *) fail "unknown format $TOOL_FORMAT" ;;
          esac

          bin_path="${TOOL_BIN_PATH:-}"
          if [ -n "$bin_path" ]; then
            if [ "$TOOL_FORMAT" != tgz ]; then
              fail "TOOL_BIN_PATH needs format tgz, got $TOOL_FORMAT"
            fi
            case "/$bin_path/" in
              //* | */../*) fail "TOOL_BIN_PATH $bin_path must be relative to the archive root without .." ;;
            esac
          fi

          archive_member() {
            local root dir found
            local matches=()
            root="$(cd -P "$1" && pwd -P)"
            while IFS= read -r found; do
              matches+=("$found")
            done < <(compgen -G "$1/$bin_path")
            if [ "${#matches[@]}" -ne 1 ]; then
              fail "($arch) TOOL_BIN_PATH $bin_path matches ${#matches[@]} files in the archive; exactly one is required"
            fi
            if [ -L "${matches[0]}" ] || [ ! -f "${matches[0]}" ]; then
              fail "($arch) TOOL_BIN_PATH $bin_path is not a regular file inside the archive"
            fi
            dir="$(cd -P "$(dirname "${matches[0]}")" && pwd -P)"
            case "$dir/" in
              "$root"/*) ;;
              *) fail "($arch) TOOL_BIN_PATH $bin_path is not a regular file inside the archive" ;;
            esac
            member="${matches[0]}"
          }

          machine="$(uname -m)"
          case "$machine" in
            x86_64 | amd64)
              arch=amd64
              url="$TOOL_URL_AMD64"
              expected="$TOOL_SHA256_AMD64"
              ;;
            aarch64 | arm64)
              arch=arm64
              url="$TOOL_URL_ARM64"
              expected="$TOOL_SHA256_ARM64"
              ;;
            *) fail "has no pin for architecture $machine" ;;
          esac

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          file="$tmp/$TOOL_NAME-$arch.download"

          echo "install: $TOOL_NAME $TOOL_VERSION $arch from $url"
          if ! curl -fsSL --retry 3 -o "$file" "$url"; then
            fail "($arch) download failed: $url"
          fi

          actual="$(digest "$file")"
          if [ "$actual" != "$expected" ]; then
            fail "($arch) checksum mismatch: expected $expected, got $actual; nothing was installed"
          fi

          bin_dir="${TOOL_BIN_DIR:-${RUNNER_TEMP:-$PWD}/brakes-bin}"
          mkdir -p "$bin_dir"
          case "$TOOL_FORMAT" in
            tgz)
              mkdir "$tmp/extract"
              tar -xzf "$file" -C "$tmp/extract"
              member="$tmp/extract/$TOOL_BIN"
              if [ -n "$bin_path" ]; then
                archive_member "$tmp/extract"
              elif [ ! -f "$member" ]; then
                fail "($arch) archive has no $TOOL_BIN at its root"
              fi
              install -m 0755 "$member" "$bin_dir/$TOOL_BIN"
              ;;
            bin)
              install -m 0755 "$file" "$bin_dir/$TOOL_BIN"
              ;;
          esac

          if [ -n "${GITHUB_PATH:-}" ]; then
            echo "$bin_dir" >>"$GITHUB_PATH"
          fi
          echo "tool: $TOOL_NAME $TOOL_VERSION sha256=$actual"
      - name: Scan for secrets with gitleaks
        env:
          BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          EVENT: "${{ github.event_name }}"
          HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
          PUSH_AFTER: "${{ github.event.after }}"
          PUSH_BEFORE: "${{ github.event.before }}"
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          baseline=.gitleaks-baseline.json

          is_sha() {
            [[ "$1" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]] && [[ ! "$1" =~ ^0+$ ]]
          }

          present() {
            git cat-file -e "$1^{commit}" 2>/dev/null
          }

          range_of() {
            local from="$1" to="$2"
            is_sha "$from" && is_sha "$to" || return 0
            if ! present "$from" || ! present "$to"; then
              if ! git fetch --no-tags --quiet origin "$from" "$to"; then
                echo "::warning::could not fetch $from and $to; scanning the full history"
              fi
            fi
            if present "$from" && present "$to"; then
              range="$from..$to"
            fi
          }

          if [ -e "$baseline" ] &&
            ! jq -e 'type == "array" and all(.[]; type == "object" and .Secret == "REDACTED")' \
              "$baseline" >/dev/null 2>&1; then
            echo "::error::$baseline is not a redacted gitleaks JSON report; regenerate it with --redact"
            exit 1
          fi

          scan=(gitleaks git --redact --exit-code 1 --report-format sarif --report-path gitleaks.sarif)
          range=""
          case "${EVENT:-}" in
            pull_request) range_of "${BASE_SHA:-}" "${HEAD_SHA:-}" && claim="$range" ;;
            push) range_of "${PUSH_BEFORE:-}" "${PUSH_AFTER:-}" && claim="pushed $range" ;;
          esac

          status=0
          if [ -n "$range" ]; then
            echo "history: $claim"
            "${scan[@]}" --log-opts "$range" . || status=$?
          else
            echo "history: full"
            case "${EVENT:-}" in
              push | workflow_dispatch | schedule)
                if [ -e "$baseline" ]; then
                  echo "baseline: $baseline"
                  scan+=(--baseline-path "$baseline")
                fi
                ;;
            esac
            "${scan[@]}" . || status=$?
          fi

          report=gitleaks.sarif
          if ! jq -e 'type == "object"' "$report" >/dev/null 2>&1; then
            echo "::error::gitleaks wrote no readable report (exit $status)"
            if [ "$status" -eq 0 ]; then
              exit 1
            fi
            exit "$status"
          fi

          findings='[.runs[]?.results[]? | [(.locations[0].physicalLocation.artifactLocation.uri // "unknown"), (.locations[0].physicalLocation.region.startLine // 0), (.ruleId // "unknown")] | map(tostring)]'
          escape='def data: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            def property: data | gsub(":"; "%3A") | gsub(","; "%2C");'
          jq -r "$escape $findings"' | .[] | "::error file=\(.[0] | property),line=\(.[1] | property)::\(.[2] | data)"' "$report"
          count=$(jq "$findings | length" "$report")

          if [ "$count" -gt 0 ]; then
            echo "::error::$count gitleaks finding(s); values withheld from the log, rotate any real credential"
            if [ "$status" -eq 0 ]; then
              exit 1
            fi
          elif [ "$status" -eq 0 ]; then
            echo "gitleaks: no findings"
          fi
          exit "$status"
      - name: Check the bypass inventory
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
          SECURITY_BYPASS_MAX_DAYS: "30"
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          cd "${1:-.}"
          today="${SECURITY_TODAY:-$(date -u +%Y-%m-%d)}"
          max_days="${SECURITY_BYPASS_MAX_DAYS:-30}"
          inventory=.agent-setup/security-exceptions.json
          semgrep_defaults='[".git",".svn",".hg","_darcs","CVS","build/","vendor/","dist/","*.min.js",".env/",".tox/","node_modules/",".npm/",".yarn/",".venv/","_opam/","_build/","_cargo/","test/","tests/","testsuite/","*_test.go"]'
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          if [ ! -e "$inventory" ]; then
            printf '"__absent__"\n' > "$work/inventory.json"
          elif jq -e . "$inventory" > /dev/null 2>&1; then
            cp "$inventory" "$work/inventory.json"
          else
            printf '"__unparsed__"\n' > "$work/inventory.json"
          fi

          read_trivy() {
            awk '
              function unquote(s) {
                if (length(s) >= 2 && ((substr(s, 1, 1) == "\"" && substr(s, length(s), 1) == "\"") ||
                                       (substr(s, 1, 1) == "\047" && substr(s, length(s), 1) == "\047")))
                  return substr(s, 2, length(s) - 2)
                return s
              }
              function yaml_scalar(s,   i) {
                sub(/^[ \t]+/, "", s)
                if (substr(s, 1, 1) == "\"" || substr(s, 1, 1) == "\047") return unquote(s)
                for (i = 1; i <= length(s); i++)
                  if (substr(s, i, 1) == "#" && (i == 1 || substr(s, i - 1, 1) ~ /[ \t]/)) { s = substr(s, 1, i - 1); break }
                sub(/[ \t]+$/, "", s)
                return s
              }
              function mentions(s) { return (s ~ /#[0-9]/ || s ~ /https?:\/\//) }
              function flush() { if (have) { printf "entry\t%s\t%d\t%s\t%d\n", id, has_expiry, expiry, issue; have = 0 } }
              function unverified() { have = 0; printf "unverified\t%d\n", NR; exit }
              BEGIN { section = 0; inline_empty = 0; have = 0; list = 0 }
              {
                sub(/\r$/, ""); line = $0; sub(/[ \t]+$/, "", line)
                t = line; sub(/^[ \t]+/, "", t)
                if (t == "" || substr(t, 1, 1) == "#" || line == "---") next
                if (line ~ /^(vulnerabilities|misconfigurations|secrets|licenses):[ \t]*(\[\])?$/) {
                  flush(); section = 1; inline_empty = (line ~ /\[\]$/); list = 0; next
                }
                if (substr(line, 1, 7) == "  - id:") {
                  v = yaml_scalar(substr(line, 8))
                  if (!section || inline_empty || v == "") unverified()
                  flush(); have = 1; id = v; has_expiry = 0; expiry = ""; issue = 0; list = 0; next
                }
                if (!have) unverified()
                if (substr(line, 1, 4) == "    " && substr(line, 5, 1) != " ") {
                  kv = substr(line, 5); i = index(kv, ":")
                  if (i == 0) unverified()
                  key = substr(kv, 1, i - 1); val = yaml_scalar(substr(kv, i + 1))
                  if (key == "statement") { issue = mentions(val); list = 0; next }
                  if (key == "expired_at") { has_expiry = (val != ""); expiry = val; list = 0; next }
                  if ((key == "paths" || key == "purls") && val == "") { list = 1; next }
                  unverified()
                }
                if (list && substr(line, 1, 8) == "      - " && length(line) > 8) next
                unverified()
              }
              END { flush() }
            ' "$1"
          }

          read_osv() {
            awk '
              function quoted(s) { return (length(s) >= 2 && substr(s, 1, 1) == "\"" && substr(s, length(s), 1) == "\"") }
              function unquote(s) {
                if (length(s) >= 2 && ((substr(s, 1, 1) == "\"" && substr(s, length(s), 1) == "\"") ||
                                       (substr(s, 1, 1) == "\047" && substr(s, length(s), 1) == "\047")))
                  return substr(s, 2, length(s) - 2)
                return s
              }
              function mentions(s) { return (s ~ /#[0-9]/ || s ~ /https?:\/\//) }
              function unverified(n) { have = 0; printf "unverified\t%d\n", n; exit }
              function flush() {
                if (have) { if (id == "") unverified(header); printf "entry\t%s\t%d\t%s\t%d\n", id, has_expiry, expiry, issue; have = 0 }
              }
              BEGIN { have = 0 }
              {
                sub(/\r$/, ""); line = $0; sub(/[ \t]+$/, "", line)
                t = line; sub(/^[ \t]+/, "", t)
                if (t == "" || substr(t, 1, 1) == "#") next
                if (line == "[[IgnoredVulns]]") { flush(); have = 1; header = NR; id = ""; has_expiry = 0; expiry = ""; issue = 0; next }
                if (!have) unverified(NR)
                i = index(line, "=")
                if (i == 0) unverified(NR)
                key = substr(line, 1, i - 1); sub(/^[ \t]+/, "", key); sub(/[ \t]+$/, "", key)
                val = substr(line, i + 1); sub(/^[ \t]+/, "", val)
                if (key == "id" && quoted(val)) { id = unquote(val); next }
                if (key == "ignoreUntil" && val != "") { has_expiry = 1; expiry = unquote(val); next }
                if (key == "reason" && quoted(val)) { issue = mentions(unquote(val)); next }
                unverified(NR)
              }
              END { flush() }
            ' "$1"
          }

          read_ignore() {
            awk '
              { sub(/\r$/, ""); t = $0; sub(/^[ \t]+/, "", t); sub(/[ \t]+$/, "", t)
                if (t == "" || substr(t, 1, 1) == "#") next
                printf "entry\t%s\n", t }
            ' "$1"
          }

          read_gitleaks_allowlist() {
            awk '
              function tomlstr(s) {
                sub(/,$/, "", s); sub(/[ \t]+$/, "", s)
                if (length(s) >= 6 && substr(s, 1, 3) == "\047\047\047" && substr(s, length(s) - 2, 3) == "\047\047\047") return substr(s, 4, length(s) - 6)
                if (length(s) >= 2 && ((substr(s, 1, 1) == "\"" && substr(s, length(s), 1) == "\"") ||
                                       (substr(s, 1, 1) == "\047" && substr(s, length(s), 1) == "\047"))) return substr(s, 2, length(s) - 2)
                return "\001"
              }
              function unverified(n) { arr = ""; printf "unverified\t%d\n", n; exit }
              BEGIN { inside = 0; arr = ""; last = 0 }
              {
                last = NR
                sub(/\r$/, ""); t = $0; sub(/^[ \t]+/, "", t); sub(/[ \t]+$/, "", t)
                if (t == "" || substr(t, 1, 1) == "#") next
                if (substr(t, 1, 1) == "[") { if (arr != "") unverified(NR); inside = (t == "[allowlist]"); next }
                if (!inside) next
                if (arr != "") {
                  if (t == "]") { arr = ""; next }
                  v = tomlstr(t)
                  if (v == "\001") unverified(NR)
                  printf "entry\t%s:%s\n", arr, v; next
                }
                i = index(t, "=")
                if (i == 0) unverified(NR)
                key = substr(t, 1, i - 1); sub(/[ \t]+$/, "", key); val = substr(t, i + 1); sub(/^[ \t]+/, "", val)
                if (key == "description" || key == "regexTarget" || val == "[]") next
                if (val == "[") { arr = key; next }
                unverified(NR)
              }
              END { if (arr != "") unverified(last) }
            ' "$1"
          }

          : > "$work/trivy.tsv"; [ -e .trivyignore.yaml ] && read_trivy .trivyignore.yaml > "$work/trivy.tsv"
          : > "$work/osv.tsv"; [ -e osv-scanner.toml ] && read_osv osv-scanner.toml > "$work/osv.tsv"
          : > "$work/gitleaksignore.tsv"; [ -e .gitleaksignore ] && read_ignore .gitleaksignore > "$work/gitleaksignore.tsv"
          : > "$work/semgrepignore.tsv"; [ -e .semgrepignore ] && read_ignore .semgrepignore > "$work/semgrepignore.tsv"
          : > "$work/gitleaks-toml.tsv"; [ -e .gitleaks.toml ] && read_gitleaks_allowlist .gitleaks.toml > "$work/gitleaks-toml.tsv"
          plain=false; [ -e .trivyignore ] && plain=true

          record=.agent-setup/coverage.json
          base_sha="${BASE_SHA:-}"
          compare=false
          unavailable=false
          printf '"__absent__"\n' > "$work/coverage-base.json"
          printf '"__absent__"\n' > "$work/coverage-head.json"
          if [ -n "$base_sha" ]; then
            if ! git cat-file -e "$base_sha^{commit}" 2> /dev/null; then
              printf '::error::Base commit %s is not available; %s cannot be compared\n' "$base_sha" "$record"
              unavailable=true
            elif git cat-file -e "$base_sha:$record" 2> /dev/null; then
              compare=true
              git show "$base_sha:$record" > "$work/coverage-base.raw"
              if jq -e . "$work/coverage-base.raw" > /dev/null 2>&1; then
                cp "$work/coverage-base.raw" "$work/coverage-base.json"
              else
                printf '"__unparsed__"\n' > "$work/coverage-base.json"
              fi
            fi
          fi
          printf '"__absent__"\n' > "$work/inventory-base.json"
          if [ -n "$base_sha" ] && [ "$unavailable" = false ] && git cat-file -e "$base_sha:$inventory" 2> /dev/null; then
            git show "$base_sha:$inventory" > "$work/inventory-base.raw"
            if jq -e . "$work/inventory-base.raw" > /dev/null 2>&1; then
              cp "$work/inventory-base.raw" "$work/inventory-base.json"
            fi
          fi
          pr_number="${PR_NUMBER:-}"
          if [ "$compare" = true ] && [ -e "$record" ]; then
            if jq -e . "$record" > /dev/null 2>&1; then
              cp "$record" "$work/coverage-head.json"
            else
              printf '"__unparsed__"\n' > "$work/coverage-head.json"
            fi
          fi

          result=$(jq -n -r \
            --slurpfile inv "$work/inventory.json" \
            --rawfile trivy "$work/trivy.tsv" \
            --rawfile osv "$work/osv.tsv" \
            --rawfile gitleaksignore "$work/gitleaksignore.tsv" \
            --rawfile semgrepignore "$work/semgrepignore.tsv" \
            --argjson semgrep_defaults "$semgrep_defaults" \
            --rawfile gitleakstoml "$work/gitleaks-toml.tsv" \
            --slurpfile coveragebase "$work/coverage-base.json" \
            --slurpfile coveragehead "$work/coverage-head.json" \
            --slurpfile invbase "$work/inventory-base.json" \
            --arg pr "$pr_number" \
            --arg record "$record" \
            --arg today "$today" --argjson max "$max_days" --argjson plain "$plain" \
            --arg inventory "$inventory" '
            def is_text: type == "string" and length > 0;
            def leap: . % 4 == 0 and (. % 100 != 0 or . % 400 == 0);
            def dim($y; $m): if $m == 2 then (if ($y | leap) then 29 else 28 end)
                             elif $m == 4 or $m == 6 or $m == 9 or $m == 11 then 30 else 31 end;
            def valid_date: is_text and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")
              and (split("-") | map(tonumber) | .[1] >= 1 and .[1] <= 12 and .[2] >= 1 and .[2] <= dim(.[0]; .[1]));
            def days: split("-") | map(tonumber)
              | (if .[1] <= 2 then .[0] - 1 else .[0] end) as $y | (.[1] + (if .[1] > 2 then -3 else 9 end)) as $m | .[2] as $d
              | ($y / 400 | floor) as $era | ($y - $era * 400) as $yoe | (((153 * $m + 2) / 5 | floor) + $d - 1) as $doy
              | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe | $era * 146097 + $doe - 719468;
            def issue_ref: is_text and (test("^#[0-9]+$") or test("^https?://."));
            def rows: split("\n") | map(select(length > 0) | split("\t"));
            def tally($state): if $state == "active" then .active += 1 elif $state == "expired" then .expired += 1 else . end;

            # An inventory entry: findings in a fixed order, then the bound, then the expiry.
            def entry_verdict($i):
              . as $e | (if (.id | is_text) then .id else "exceptions[\($i)]" end) as $label
              | (["id", "kind", "target", "reason", "issue", "owner", "created", "expires"]
                  | map(select(($e[.] | is_text) | not) | "Exception \($label) is missing \(.)"))
                + (if (.kind | is_text) and (.kind | IN("job-bypass", "ruleset-bypass-actor", "repo-variable", "continue-on-error", "allowlist", "coverage-reset", "accepted-risk") | not)
                   then ["Exception \($label) has an unknown kind \(.kind)"] else [] end)
                + (if (.created | is_text) and (.created | valid_date | not) then ["Exception \($label) has an invalid created date \(.created)"] else [] end)
                + (if (.expires | is_text) and (.expires | valid_date | not) then ["Exception \($label) has an invalid expires date \(.expires)"] else [] end)
                + (if (.issue | is_text) and (.issue | issue_ref | not) then ["Exception \($label) has an invalid issue reference \(.issue)"] else [] end)
                | if length > 0 then {state: "invalid", findings: .} else
                  (($e.expires | days) - ($e.created | days)) as $days
                  | (if $e.kind == "allowlist" or $e.kind == "ruleset-bypass-actor" or $e.kind == "accepted-risk" then 365 else $max end) as $bound
                  | if $days < 0 then {state: "invalid", findings: ["Exception \($label) expires on \($e.expires), before it was created on \($e.created)"]}
                    elif $days > $bound then {state: "invalid", findings: ["Exception \($label) lasts \($days) days; \($e.kind) allows at most \($bound)"]}
                    elif ($e.expires | days) < ($today | days) then {state: "expired", findings: ["Exception \($label) expired on \($e.expires)"]}
                    else {state: "active", findings: []} end end;

            def inventory_report:
              $inv[0] as $doc
              | if $doc == "__absent__" then {findings: [], active: 0, expired: 0, targets: []}
                elif $doc == "__unparsed__" or ($doc | type) != "object" or ($doc.schema | type) != "number"
                     or ($doc.exceptions | type) != "array" or ($doc.exceptions | all(type == "object") | not)
                  then {findings: ["\($inventory) does not parse"], active: 0, expired: 0, targets: []}
                elif $doc.schema != 1 then {findings: ["\($inventory) has an unsupported schema \($doc.schema)"], active: 0, expired: 0, targets: []}
                else reduce ($doc.exceptions | keys[]) as $i ({findings: [], active: 0, expired: 0};
                       ($doc.exceptions[$i] | entry_verdict($i)) as $v | tally($v.state) | .findings += $v.findings)
                     + {targets: [$doc.exceptions[] | select(.kind == "allowlist") | .target | select(is_text)]}
                end;

            # A native file: the first out-of-shape line, or every entry judged.
            def native_report($rows; $file; $expiry_field; $issue_field):
              ($rows | map(select(.[0] == "unverified")) | first) as $u
              | if $u then {findings: ["\($file) is unverified: line \($u[1]) is outside the generated shape"], active: 0, expired: 0}
                else reduce ($rows[] | select(.[0] == "entry")) as $r ({findings: [], active: 0, expired: 0};
                  $r[1] as $id | ($r[2] == "1") as $has | $r[3] as $exp | ($r[4] == "1") as $issue
                  | ([(if ($has | not) then "Exception \($id) in \($file) has no \($expiry_field)"
                       elif ($exp | valid_date | not) then "Exception \($id) in \($file) has an invalid \($expiry_field) date \($exp)" else empty end),
                      (if ($issue | not) then "Exception \($id) in \($file) has no issue in \($issue_field)" else empty end)]) as $f
                  | if ($f | length) > 0 then .findings += $f
                    elif ($exp | days) < ($today | days) then .findings += ["Exception \($id) in \($file) expired on \($exp)"] | .expired += 1
                    else .active += 1 end)
                end;

            def unregistered($rows; $file; $noun; $targets):
              [$rows[] | select(.[0] == "entry") | .[1] | select(IN($targets[]; "\($file)#\(.)") | not)
               | "\($file) \($noun) \(.) is not registered in \($inventory)"];

            # The coverage record: [[app, value]] in the generated shape, null otherwise.
            def coverage_apps: if type == "object" and .schema == 1 and (.apps | type) == "object"
                and (.apps | all(type == "number")) then (.apps | to_entries | map([.key, (.value + 0)])) else null end;
            def coverage_decreases:
              ($coveragebase[0] | coverage_apps) as $base
              | if $base == null then []
                else (if $coveragehead[0] == "__absent__" then [] else ($coveragehead[0] | coverage_apps) end) as $head
                | if $head == null then ["\($record) does not parse"]
                  elif ($inv[0] | type) == "object" and $inv[0].schema == 1 and ($inv[0].exceptions | type) == "array"
                       and ($inv[0].exceptions | all(type == "object"))
                       and ([$inv[0].exceptions | keys[] as $i | $inv[0].exceptions[$i]
                             | select(.kind == "coverage-reset" and .target == $record)
                             | select(entry_verdict($i).state == "active")] | length > 0) then []
                  else [$base[] | .[0] as $app | .[1] as $old
                        | ([$head[] | select(.[0] == $app) | .[1]] | first) as $new
                        | select($new == null or $new < $old)
                        | "\($record) lowers \($app) from \($old) to \(if $new == null then "absent" else $new end) without an active coverage-reset"]
                  end
                end;

            # coverage-reset entries this pull request adds whose diff-coverage#<n> target
            # names another pull request (an id absent from the base inventory is added).
            def foreign_diff_coverage_resets:
              if $pr == "" or ($inv[0] | type) != "object" or $inv[0].schema != 1
                 or ($inv[0].exceptions | type) != "array" or ($inv[0].exceptions | all(type == "object") | not)
              then []
              else ($invbase[0] | if type == "object" and (.schema | type) == "number"
                      and (.exceptions | type) == "array" and (.exceptions | all(type == "object"))
                    then [.exceptions[] | .id | select(is_text)] else [] end) as $base_ids
                | "diff-coverage#\($pr)" as $own
                | [$inv[0].exceptions | keys[] as $i | $inv[0].exceptions[$i]
                   | select((.id | is_text | not) or (.id as $id | IN($base_ids[]; $id) | not))
                   | select(.kind == "coverage-reset" and (.target | is_text) and (.target | startswith("diff-coverage#")) and .target != $own)
                   | "Exception \(if (.id | is_text) then .id else "exceptions[\($i)]" end) targets \(.target); a coverage-reset added in pull request #\($pr) must target \($own)"]
              end;

            inventory_report as $inventory_report
            | native_report($trivy | rows; ".trivyignore.yaml"; "expired_at"; "statement") as $t
            | native_report($osv | rows; "osv-scanner.toml"; "ignoreUntil"; "reason") as $o
            | (if $plain then [".trivyignore cannot carry an expiry; use .trivyignore.yaml"] else [] end) as $p
            | unregistered($gitleaksignore | rows; ".gitleaksignore"; "entry"; $inventory_report.targets) as $g
            | unregistered($semgrepignore | rows | map(select(.[1] as $e | IN($semgrep_defaults[]; $e) | not));
                ".semgrepignore"; "entry"; $inventory_report.targets) as $s
            | (($gitleakstoml | rows) | map(select(.[0] == "unverified")) | first) as $tu
            | (if $tu then [".gitleaks.toml is unverified: line \($tu[1]) is outside the generated shape"]
               else unregistered($gitleakstoml | rows; ".gitleaks.toml"; "allowlist entry"; $inventory_report.targets) end) as $c
            | foreign_diff_coverage_resets as $f
            | ($inventory_report.findings + $t.findings + $o.findings + $p + $g + $s + $c + coverage_decreases + $f) as $findings
            | ($findings | map("::error::" + .)) + ["exceptions: \($inventory_report.active + $t.active + $o.active) active, \($inventory_report.expired + $t.expired + $o.expired) expired, \(($g | length) + ($s | length) + (if $tu then 0 else ($c | length) end) + ($f | length)) unregistered"]
            | .[]
          ')
          printf '%s\n' "$result"
          case "$result" in
            *"::error::"*) exit 1 ;;
          esac
          if [ "$unavailable" = true ]; then
            exit 1
          fi
      - name: Upload the gitleaks report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: "1"
  deps-scan:
    name: deps-scan
    needs: scope
    if: needs.scope.outputs.tier != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - id: bypass
        name: Apply a registered bypass
        env:
          SECURITY_BYPASS: "${{ vars.SECURITY_BYPASS }}"
          SECURITY_BYPASS_MAX_DAYS: "30"
        run: |
          set -- deps-scan
          #!/usr/bin/env bash
          set -euo pipefail

          job="${1:?usage: bypass-variable.sh <job-id> [repository-root]}"
          cd "${2:-.}"
          today="${SECURITY_TODAY:-$(date -u +%Y-%m-%d)}"
          max_days="${SECURITY_BYPASS_MAX_DAYS:-30}"
          inventory=.agent-setup/security-exceptions.json
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          if [ ! -e "$inventory" ]; then
            printf '"__absent__"\n' > "$work/inventory.json"
          elif jq -e . "$inventory" > /dev/null 2>&1; then
            cp "$inventory" "$work/inventory.json"
          else
            printf '"__unparsed__"\n' > "$work/inventory.json"
          fi

          result=$(jq -n -r \
            --slurpfile inv "$work/inventory.json" \
            --arg raw "${SECURITY_BYPASS:-}" --arg job "$job" \
            --arg today "$today" --argjson max "$max_days" --arg inventory "$inventory" '
            def is_text: type == "string" and length > 0;
            def leap: . % 4 == 0 and (. % 100 != 0 or . % 400 == 0);
            def dim($y; $m): if $m == 2 then (if ($y | leap) then 29 else 28 end)
                             elif $m == 4 or $m == 6 or $m == 9 or $m == 11 then 30 else 31 end;
            def valid_date: is_text and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")
              and (split("-") | map(tonumber) | .[1] >= 1 and .[1] <= 12 and .[2] >= 1 and .[2] <= dim(.[0]; .[1]));
            def days: split("-") | map(tonumber)
              | (if .[1] <= 2 then .[0] - 1 else .[0] end) as $y | (.[1] + (if .[1] > 2 then -3 else 9 end)) as $m | .[2] as $d
              | ($y / 400 | floor) as $era | ($y - $era * 400) as $yoe | (((153 * $m + 2) / 5 | floor) + $d - 1) as $doy
              | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe | $era * 146097 + $doe - 719468;
            def issue_ref: is_text and (test("^#[0-9]+$") or test("^https?://."));

            # The same verdict as exceptions-check.sh, entry by entry.
            def entry_verdict($i):
              . as $e | (if (.id | is_text) then .id else "exceptions[\($i)]" end) as $label
              | (["id", "kind", "target", "reason", "issue", "owner", "created", "expires"]
                  | map(select(($e[.] | is_text) | not) | "Exception \($label) is missing \(.)"))
                + (if (.kind | is_text) and (.kind | IN("job-bypass", "ruleset-bypass-actor", "repo-variable", "continue-on-error", "allowlist", "coverage-reset", "accepted-risk") | not)
                   then ["Exception \($label) has an unknown kind \(.kind)"] else [] end)
                + (if (.created | is_text) and (.created | valid_date | not) then ["Exception \($label) has an invalid created date \(.created)"] else [] end)
                + (if (.expires | is_text) and (.expires | valid_date | not) then ["Exception \($label) has an invalid expires date \(.expires)"] else [] end)
                + (if (.issue | is_text) and (.issue | issue_ref | not) then ["Exception \($label) has an invalid issue reference \(.issue)"] else [] end)
                | if length > 0 then {state: "invalid", findings: .} else
                  (($e.expires | days) - ($e.created | days)) as $days
                  | (if $e.kind == "allowlist" or $e.kind == "ruleset-bypass-actor" or $e.kind == "accepted-risk" then 365 else $max end) as $bound
                  | if $days < 0 then {state: "invalid", findings: ["Exception \($label) expires on \($e.expires), before it was created on \($e.created)"]}
                    elif $days > $bound then {state: "invalid", findings: ["Exception \($label) lasts \($days) days; \($e.kind) allows at most \($bound)"]}
                    elif ($e.expires | days) < ($today | days) then {state: "expired", findings: ["Exception \($label) expired on \($e.expires)"]}
                    else {state: "active", findings: []} end end;

            def ids: if ($raw | test("^\\s*$")) then [] else (try ($raw | fromjson) catch "__invalid__") end;
            def valid_ids: type == "array" and all(type == "string" and length > 0);

            def judge($id):
              $inv[0] as $doc
              | if $doc == "__absent__" then {error: "Bypass \($id) is not registered in \($inventory)"}
                elif $doc == "__unparsed__" or ($doc | type) != "object" or ($doc.schema | type) != "number"
                     or ($doc.exceptions | type) != "array" or ($doc.exceptions | all(type == "object") | not)
                  then {error: "\($inventory) does not parse"}
                elif $doc.schema != 1 then {error: "\($inventory) has an unsupported schema \($doc.schema)"}
                else ([$doc.exceptions | keys[] | select($doc.exceptions[.].id == $id)] | first) as $i
                  | if $i == null then {error: "Bypass \($id) is not registered in \($inventory)"}
                    else $doc.exceptions[$i] as $e | ($e | entry_verdict($i)) as $v
                    | if $v.state == "invalid" then {error: "Bypass \($id) is not a valid exception; see security-gate"}
