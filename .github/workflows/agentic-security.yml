                      elif $e.target != $job then {error: "Bypass \($id) targets \($e.target), not \($job)"}
                      elif $v.state == "expired" then {error: "Bypass \($id) expired on \($e.expires); remove the variable or renew the exception"}
                      else {grant: {id: $id, expires: $e.expires, issue: $e.issue}} end end end;

            (if $job == "security-gate" then [{error: "security-gate admits no bypass variable"}]
             elif (ids | valid_ids | not) then [{error: "SECURITY_BYPASS is not a JSON array of exception ids"}]
             else [ids[] | judge(.)] end) as $verdicts
            | ($verdicts | map(select(.error) | "::error::" + .error))
              + ($verdicts | map(select(.grant) | .grant | "::warning::bypass \(.id) until \(.expires) (\(.issue))", "bypass: \(.id)"))
              + (if ($verdicts | length) == 0 then ["bypass: none"] else [] end)
            | .[]
          ')
          printf '%s\n' "$result"
          case "$result" in
            *"::error::"*) exit 1 ;;
          esac
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            printf '%s\n' "$result" | awk '/^bypass: / && $2 != "none" { print "id=" $2 }' >> "$GITHUB_OUTPUT"
          fi
      - name: Install osv-scanner
        if: steps.bypass.outputs.id == ''
        env:
          TOOL_BIN: "osv-scanner"
          TOOL_FORMAT: "bin"
          TOOL_NAME: "osv-scanner"
          TOOL_SHA256_AMD64: "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
          TOOL_SHA256_ARM64: "4061ef4c021ed3c47f203b818f337e351336cc5cd67c0274fc36bd1dfc728dd7"
          TOOL_URL_AMD64: "https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64"
          TOOL_URL_ARM64: "https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_arm64"
          TOOL_VERSION: "2.7.0"
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          for name in TOOL_NAME TOOL_VERSION TOOL_BIN TOOL_FORMAT \
            TOOL_URL_AMD64 TOOL_SHA256_AMD64 TOOL_URL_ARM64 TOOL_SHA256_ARM64; do
            if [ -z "${!name:-}" ]; then
              echo "::error::security: install-tool.sh needs $name"
              exit 1
            fi
          done

          fail() {
            echo "::error::security: $TOOL_NAME $TOOL_VERSION $*"
            exit 1
          }

          digest() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | cut -d' ' -f1
            else
              shasum -a 256 "$1" | cut -d' ' -f1
            fi
          }

          case "$TOOL_FORMAT" in
            tgz | bin) ;;
            *) fail "unknown format $TOOL_FORMAT" ;;
          esac

          bin_path="${TOOL_BIN_PATH:-}"
          if [ -n "$bin_path" ]; then
            if [ "$TOOL_FORMAT" != tgz ]; then
              fail "TOOL_BIN_PATH needs format tgz, got $TOOL_FORMAT"
            fi
            case "/$bin_path/" in
              //* | */../*) fail "TOOL_BIN_PATH $bin_path must be relative to the archive root without .." ;;
            esac
          fi

          archive_member() {
            local root dir found
            local matches=()
            root="$(cd -P "$1" && pwd -P)"
            while IFS= read -r found; do
              matches+=("$found")
            done < <(compgen -G "$1/$bin_path")
            if [ "${#matches[@]}" -ne 1 ]; then
              fail "($arch) TOOL_BIN_PATH $bin_path matches ${#matches[@]} files in the archive; exactly one is required"
            fi
            if [ -L "${matches[0]}" ] || [ ! -f "${matches[0]}" ]; then
              fail "($arch) TOOL_BIN_PATH $bin_path is not a regular file inside the archive"
            fi
            dir="$(cd -P "$(dirname "${matches[0]}")" && pwd -P)"
            case "$dir/" in
              "$root"/*) ;;
              *) fail "($arch) TOOL_BIN_PATH $bin_path is not a regular file inside the archive" ;;
            esac
            member="${matches[0]}"
          }

          machine="$(uname -m)"
          case "$machine" in
            x86_64 | amd64)
              arch=amd64
              url="$TOOL_URL_AMD64"
              expected="$TOOL_SHA256_AMD64"
              ;;
            aarch64 | arm64)
              arch=arm64
              url="$TOOL_URL_ARM64"
              expected="$TOOL_SHA256_ARM64"
              ;;
            *) fail "has no pin for architecture $machine" ;;
          esac

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          file="$tmp/$TOOL_NAME-$arch.download"

          echo "install: $TOOL_NAME $TOOL_VERSION $arch from $url"
          if ! curl -fsSL --retry 3 -o "$file" "$url"; then
            fail "($arch) download failed: $url"
          fi

          actual="$(digest "$file")"
          if [ "$actual" != "$expected" ]; then
            fail "($arch) checksum mismatch: expected $expected, got $actual; nothing was installed"
          fi

          bin_dir="${TOOL_BIN_DIR:-${RUNNER_TEMP:-$PWD}/brakes-bin}"
          mkdir -p "$bin_dir"
          case "$TOOL_FORMAT" in
            tgz)
              mkdir "$tmp/extract"
              tar -xzf "$file" -C "$tmp/extract"
              member="$tmp/extract/$TOOL_BIN"
              if [ -n "$bin_path" ]; then
                archive_member "$tmp/extract"
              elif [ ! -f "$member" ]; then
                fail "($arch) archive has no $TOOL_BIN at its root"
              fi
              install -m 0755 "$member" "$bin_dir/$TOOL_BIN"
              ;;
            bin)
              install -m 0755 "$file" "$bin_dir/$TOOL_BIN"
              ;;
          esac

          if [ -n "${GITHUB_PATH:-}" ]; then
            echo "$bin_dir" >>"$GITHUB_PATH"
          fi
          echo "tool: $TOOL_NAME $TOOL_VERSION sha256=$actual"
      - name: Scan dependencies with osv-scanner
        if: steps.bypass.outputs.id == ''
        run: |
