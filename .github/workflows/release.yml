# Prebuilt binaries for a version tag (#1278). Each target builds natively on a
# GitHub-hosted runner with the locked dependencies; the archives and their
# SHA256SUMS get a build-provenance attestation (`gh attestation verify`), and only
# the publishing job may write: it attaches them to the tag's release. Binaries are
# release assets, never tracked.
name: Release
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      # The binary reports VERSION; a tag that disagrees would publish a mislabelled one.
      - name: Check the tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $version"
            exit 1
          fi
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p brakes --target "$TARGET"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir dist
          tar -czf "dist/brakes-$GITHUB_REF_NAME-$TARGET.tar.gz" \
            -C "target/$TARGET/release" brakes \
            -C "$GITHUB_WORKSPACE" LICENSE README.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brakes-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
  attest:
    name: Attest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write # the OIDC token Sigstore signs the attestation with
      attestations: write # stores the attestation for `gh attestation verify`
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: brakes-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          count="$(find . -maxdepth 1 -name 'brakes-*.tar.gz' | wc -l)"
          if [ "$count" -ne 3 ]; then
            echo "::error::expected 3 archives, found $count"
            exit 1
          fi
          sha256sum brakes-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # creates the release and attaches its assets
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist
      - name: Attach the archives and SHA256SUMS to the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" brakes-*.tar.gz SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" brakes-*.tar.gz SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
