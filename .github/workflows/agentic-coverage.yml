# Managed by brakes (security, #22). Your CI calls it after the test jobs
# that upload agentic-coverage-<app>-* artifacts; it judges them and runs no test.
name: agentic-coverage
on:
  workflow_call:
permissions:
  contents: read
jobs:
  diff-coverage:
    name: diff-coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        if: (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: "0"
          persist-credentials: "false"
      - id: bypass
        name: Apply a registered bypass
        if: github.event_name == 'pull_request'
        env:
          SECURITY_BYPASS: "${{ vars.SECURITY_BYPASS }}"
          SECURITY_BYPASS_MAX_DAYS: "30"
        run: |
          set -- diff-coverage
          #!/usr/bin/env bash
          set -euo pipefail

          job="${1:?usage: bypass-variable.sh <job-id> [repository-root]}"
          cd "${2:-.}"
          today="${SECURITY_TODAY:-$(date -u +%Y-%m-%d)}"
          max_days="${SECURITY_BYPASS_MAX_DAYS:-30}"
          inventory=.agent-setup/security-exceptions.json
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          if [ ! -e "$inventory" ]; then
            printf '"__absent__"\n' > "$work/inventory.json"
          elif jq -e . "$inventory" > /dev/null 2>&1; then
            cp "$inventory" "$work/inventory.json"
          else
            printf '"__unparsed__"\n' > "$work/inventory.json"
          fi

          result=$(jq -n -r \
            --slurpfile inv "$work/inventory.json" \
            --arg raw "${SECURITY_BYPASS:-}" --arg job "$job" \
            --arg today "$today" --argjson max "$max_days" --arg inventory "$inventory" '
            def is_text: type == "string" and length > 0;
            def leap: . % 4 == 0 and (. % 100 != 0 or . % 400 == 0);
            def dim($y; $m): if $m == 2 then (if ($y | leap) then 29 else 28 end)
                             elif $m == 4 or $m == 6 or $m == 9 or $m == 11 then 30 else 31 end;
            def valid_date: is_text and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")
              and (split("-") | map(tonumber) | .[1] >= 1 and .[1] <= 12 and .[2] >= 1 and .[2] <= dim(.[0]; .[1]));
            def days: split("-") | map(tonumber)
              | (if .[1] <= 2 then .[0] - 1 else .[0] end) as $y | (.[1] + (if .[1] > 2 then -3 else 9 end)) as $m | .[2] as $d
              | ($y / 400 | floor) as $era | ($y - $era * 400) as $yoe | (((153 * $m + 2) / 5 | floor) + $d - 1) as $doy
              | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe | $era * 146097 + $doe - 719468;
            def issue_ref: is_text and (test("^#[0-9]+$") or test("^https?://."));

            # The same verdict as exceptions-check.sh, entry by entry.
            def entry_verdict($i):
              . as $e | (if (.id | is_text) then .id else "exceptions[\($i)]" end) as $label
              | (["id", "kind", "target", "reason", "issue", "owner", "created", "expires"]
                  | map(select(($e[.] | is_text) | not) | "Exception \($label) is missing \(.)"))
                + (if (.kind | is_text) and (.kind | IN("job-bypass", "ruleset-bypass-actor", "repo-variable", "continue-on-error", "allowlist", "coverage-reset", "accepted-risk") | not)
                   then ["Exception \($label) has an unknown kind \(.kind)"] else [] end)
                + (if (.created | is_text) and (.created | valid_date | not) then ["Exception \($label) has an invalid created date \(.created)"] else [] end)
                + (if (.expires | is_text) and (.expires | valid_date | not) then ["Exception \($label) has an invalid expires date \(.expires)"] else [] end)
                + (if (.issue | is_text) and (.issue | issue_ref | not) then ["Exception \($label) has an invalid issue reference \(.issue)"] else [] end)
                | if length > 0 then {state: "invalid", findings: .} else
                  (($e.expires | days) - ($e.created | days)) as $days
                  | (if $e.kind == "allowlist" or $e.kind == "ruleset-bypass-actor" or $e.kind == "accepted-risk" then 365 else $max end) as $bound
                  | if $days < 0 then {state: "invalid", findings: ["Exception \($label) expires on \($e.expires), before it was created on \($e.created)"]}
                    elif $days > $bound then {state: "invalid", findings: ["Exception \($label) lasts \($days) days; \($e.kind) allows at most \($bound)"]}
                    elif ($e.expires | days) < ($today | days) then {state: "expired", findings: ["Exception \($label) expired on \($e.expires)"]}
                    else {state: "active", findings: []} end end;

            def ids: if ($raw | test("^\\s*$")) then [] else (try ($raw | fromjson) catch "__invalid__") end;
            def valid_ids: type == "array" and all(type == "string" and length > 0);

            def judge($id):
              $inv[0] as $doc
              | if $doc == "__absent__" then {error: "Bypass \($id) is not registered in \($inventory)"}
                elif $doc == "__unparsed__" or ($doc | type) != "object" or ($doc.schema | type) != "number"
                     or ($doc.exceptions | type) != "array" or ($doc.exceptions | all(type == "object") | not)
                  then {error: "\($inventory) does not parse"}
                elif $doc.schema != 1 then {error: "\($inventory) has an unsupported schema \($doc.schema)"}
                else ([$doc.exceptions | keys[] | select($doc.exceptions[.].id == $id)] | first) as $i
                  | if $i == null then {error: "Bypass \($id) is not registered in \($inventory)"}
                    else $doc.exceptions[$i] as $e | ($e | entry_verdict($i)) as $v
                    | if $v.state == "invalid" then {error: "Bypass \($id) is not a valid exception; see security-gate"}
                      elif $e.kind != "job-bypass" then {error: "Bypass \($id) is a \($e.kind) exception, not a job-bypass"}
                      elif $e.target != $job then {error: "Bypass \($id) targets \($e.target), not \($job)"}
                      elif $v.state == "expired" then {error: "Bypass \($id) expired on \($e.expires); remove the variable or renew the exception"}
                      else {grant: {id: $id, expires: $e.expires, issue: $e.issue}} end end end;

            (if $job == "security-gate" then [{error: "security-gate admits no bypass variable"}]
             elif (ids | valid_ids | not) then [{error: "SECURITY_BYPASS is not a JSON array of exception ids"}]
             else [ids[] | judge(.)] end) as $verdicts
            | ($verdicts | map(select(.error) | "::error::" + .error))
              + ($verdicts | map(select(.grant) | .grant | "::warning::bypass \(.id) until \(.expires) (\(.issue))", "bypass: \(.id)"))
              + (if ($verdicts | length) == 0 then ["bypass: none"] else [] end)
            | .[]
          ')
          printf '%s\n' "$result"
          case "$result" in
            *"::error::"*) exit 1 ;;
          esac
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            printf '%s\n' "$result" | awk '/^bypass: / && $2 != "none" { print "id=" $2 }' >> "$GITHUB_OUTPUT"
          fi
      - name: Install uv
        if: github.event_name == 'pull_request' && steps.bypass.outputs.id == ''
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - id: merge-base
        name: Find the merge base
        if: github.event_name == 'pull_request' && steps.bypass.outputs.id == ''
        env:
          BASE_REF: "${{ github.base_ref }}"
        run: |
          echo "sha=$(git merge-base "origin/$BASE_REF" HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore the base coverage report
        if: github.event_name == 'pull_request' && steps.bypass.outputs.id == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: "coverage-report-${{ steps.merge-base.outputs.sha }}"
          path: ".coverage-base"
      - name: Download the coverage of root
        if: (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && steps.bypass.outputs.id == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ".coverage-parts/root"
          pattern: "agentic-coverage-root-*"
      - id: measure-root
        name: Combine the coverage of root
        if: (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && steps.bypass.outputs.id == ''
        env:
          APP_PATH: "."
          MERGE_BASE: "${{ steps.merge-base.outputs.sha }}"
        run: |
          if [ -z "$(find "$GITHUB_WORKSPACE/.coverage-parts/root" -type f 2> /dev/null)" ]; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "root: no test job uploaded coverage on this push; its previous base report is kept"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -n "$MERGE_BASE" ] && [ -z "$(git -C "$GITHUB_WORKSPACE" diff --name-only "$MERGE_BASE" HEAD -- "$APP_PATH")" ]; then
              echo "root: no test job uploaded coverage and the pull request changes nothing under $APP_PATH; not judged"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::No coverage data: this run uploaded no agentic-coverage-root-* artifact; upload its LCOV report (*.info) from every test job of root as docs/agent-setup/security-gates.md shows for rust. brakes never runs the tests to measure them"
            exit 1
          fi
          # shellcheck disable=SC2016
          find "$GITHUB_WORKSPACE/.coverage-parts/root" -type f -name '*.info' | sort | xargs awk -F'[:,]' '/^SF:/ { f = substr($0, 4); if (!(f in seen)) { seen[f] = 1; order[++n] = f }; next } /^DA:/ && f != "" { k = f SUBSEP $2; if (!(k in hits)) { hits[k] = 0; lines[f] = lines[f] $2 " " }; if ($3 + 0 > hits[k]) hits[k] = $3 + 0; next } END { for (i = 1; i <= n; i++) { f = order[i]; print "SF:" f; m = split(lines[f], l, " "); for (j = 1; j <= m; j++) if (l[j] != "") print "DA:" l[j] "," hits[f SUBSEP l[j]]; print "end_of_record" } }' > lcov.info
      - name: Restore the previous base report
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: "coverage-report-${{ github.event.before }}"
          path: ".coverage-base"
      - name: Keep the per-file coverage reports
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          if [ -f lcov.info ]; then
            mkdir -p .coverage-base/root
            cp lcov.info .coverage-base/root/lcov.info
          fi
      - name: Save the per-file coverage reports
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: "coverage-report-${{ github.sha }}"
          path: ".coverage-base"
      - name: Write diff-coverage.sh
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.bypass.outputs.id == '' }}
        run: |
          cat > "$RUNNER_TEMP/diff-coverage.sh" <<'DIFF_COVERAGE_SH'
          #!/usr/bin/env bash
          set -euo pipefail

          mode="${1:?usage: diff-coverage.sh changed|characterization [repository-root]}"
          cd "${2:-.}"
          today="${SECURITY_TODAY:-$(date -u +%Y-%m-%d)}"
          base_ref="${BASE_REF:?BASE_REF is required}"
          report="${DIFF_REPORT:?DIFF_REPORT is required}"
          format="${DIFF_FORMAT:?DIFF_FORMAT is required}"
          app="${APP_ID:?APP_ID is required}"
          inventory=.agent-setup/security-exceptions.json
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          if [ -n "${PR_NUMBER:-}" ] && [ -e "$inventory" ]; then
            grant=$(jq -r --arg target "diff-coverage#$PR_NUMBER" --arg today "$today" '
              [(.exceptions // [])[] | objects
               | select(.kind == "coverage-reset" and .target == $target
                        and (.expires | type) == "string" and (.expires | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))
                        and .expires >= $today)]
              | first // empty | "\(.id)\t\(.expires)\t\(.issue)"' "$inventory" 2> /dev/null) || grant=""
            if [ -n "$grant" ]; then
              IFS=$'\t' read -r id expires issue <<< "$grant"
              echo "::warning::coverage-reset $id until $expires ($issue)"
              echo "bypass: $id"
              exit 0
            fi
          fi

          if ! merge_base=$(git merge-base "origin/$base_ref" HEAD 2> /dev/null); then
            echo "::error::No merge base with origin/$base_ref; the job needs fetch-depth 0"
            exit 1
          fi

          case "$mode" in
            changed)
              if [ ! -e "$report" ]; then
                echo "::error::Coverage report $report is absent"
                exit 1
              fi
              min="${MIN:?MIN is required}"
              read -ra diff_cover <<< "${DIFF_COVER:-diff-cover}"
              rc=0
              "${diff_cover[@]}" "$report" "--compare-branch=origin/$base_ref" "--fail-under=$min" \
                --format "json:$work/diff-cover.json" > "$work/diff-cover.log" 2>&1 || rc=$?
              if [ ! -s "$work/diff-cover.json" ]; then
                cat "$work/diff-cover.log"
                echo "::error::diff-cover wrote no report (exit $rc)"
                exit 1
              fi
              read -r measured percent < <(jq -r '"\(.total_num_lines) \(.total_percent_covered)"' "$work/diff-cover.json")
              if [ "$measured" = 0 ]; then
                echo "changed lines of $app: none measured"
                exit 0
              fi
              echo "diff-coverage $app: $percent % of $measured changed lines"
              if [ "$rc" -ne 0 ]; then
                if jq -e --argjson min "$min" '.total_percent_covered < $min' "$work/diff-cover.json" > /dev/null; then
                  echo "::error::Changed lines of $app covered $percent %, below $min %"
                else
                  cat "$work/diff-cover.log"
                  echo "::error::diff-cover failed (exit $rc)"
                fi
                exit 1
              fi
              ;;

            characterization)
              ext="${SOURCE_EXT:?SOURCE_EXT is required}"
              absent="${ABSENT:-warn}"
              absent_hint="${ABSENT_HINT:-set [tool.coverage.run] source so it can be judged}"
              base_report="${BASE_REPORT:-}"
              if [ -n "$base_report" ] && [ -s "$base_report" ]; then
                cp "$base_report" "$work/base-report"
                echo "base report: cache ($merge_base)"
              else
                echo "::warning::$app: no base report for $merge_base; not judged"
                exit 0
              fi

              case "$format" in
                lcov)
                  awk -F'[:,]' '
                    /^SF:/ { file = substr($0, 4); hit[file] += 0; next }
                    /^DA:/ && file != "" { if ($3 + 0 > 0) hit[file] = 1; next }
                    /^end_of_record/ { file = ""; next }
                    END { for (f in hit) printf "%s\t%d\n", f, hit[f] }
                  ' "$work/base-report" > "$work/files.tsv"
                  ;;
                cobertura)
                  awk '
                    function attr(line, name,    rest) {
                      if (match(line, name "=\"[^\"]*\"") == 0) return ""
                      rest = substr(line, RSTART + length(name) + 2, RLENGTH - length(name) - 3)
                      return rest
                    }
                    /<class / { file = attr($0, "filename"); hit[file] += 0; next }
                    /<\/class>/ { file = ""; next }
                    /<line / && file != "" { if (attr($0, "hits") + 0 > 0) hit[file] = 1; next }
                    END { for (f in hit) printf "%s\t%d\n", f, hit[f] }
                  ' "$work/base-report" > "$work/files.tsv"
                  ;;
                *)
                  echo "::error::Unknown report format $format"
                  exit 1
                  ;;
              esac

              git diff --name-status --diff-filter=MR "$merge_base"...HEAD \
                | awk -F'\t' '{ print ($1 ~ /^R/) ? $3 : $2 }' \
                | APP_PATH="${APP_PATH:-.}" EXCLUDE_PATHS="${EXCLUDE_PATHS:-}" awk -v ext="$ext" '
                    BEGIN { app_path = ENVIRON["APP_PATH"]; n = split(ENVIRON["EXCLUDE_PATHS"], skip, "\n") }
                    app_path != "." && index($0, app_path "/") != 1 { next }
                    { for (i = 1; i <= n; i++) if (skip[i] != "" && index($0, skip[i] "/") == 1) next }
                    $0 !~ ("\\." ext "$") { next }
                    $0 ~ /(^|\/)(tests?|benches|examples)\// { next }
                    $0 ~ /(^|\/)(test_[^\/]*\.py|[^\/]*_test\.py|conftest\.py|build\.rs)$/ { next }
                    { print }
                  ' > "$work/modified.txt"

              awk -F'\t' -v absent="$absent" -v hint="$absent_hint" -v sha="$merge_base" -v table="$work/files.tsv" -v app="$app" '
                BEGIN {
                  while ((getline row < table) > 0) {
                    split(row, cell, "\t"); file[++n] = cell[1]; hit[n] = cell[2]
                  }
                }
                {
                  path = $0; found = 0; executed = 0
                  for (i = 1; i <= n; i++) {
                    f = file[i]
                    if (f == path || substr(f, length(f) - length(path)) == "/" path ||
                        substr(path, length(path) - length(f)) == "/" f) {
                      found = 1; if (hit[i]) executed = 1
                    }
                  }
                  judged++
                  if (found && executed) next
                  if (!found && absent == "warn") {
                    printf "::warning::characterization: %s is not in the base report; %s\n", path, hint
                    next
                  }
                  failed++
                  printf "::error::Characterization first: %s had no test executing it at %s; add tests of its current behaviour in a separate pull request before changing it\n", path, sha
                }
                END {
                  printf "characterization %s: %d modified source files judged at %s, %d without a test\n", app, judged, sha, failed
                  exit (failed > 0)
                }
              ' "$work/modified.txt"
              ;;

            *)
              echo "usage: diff-coverage.sh changed|characterization [repository-root]" >&2
              exit 1
              ;;
          esac
          DIFF_COVERAGE_SH
      - name: Check the changed lines of root
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.bypass.outputs.id == '' && steps.measure-root.outcome == 'success' && steps.measure-root.outputs.skip != 'true' }}
        env:
          APP_ID: root
          BASE_REF: "${{ github.base_ref }}"
          DIFF_COVER: "uvx diff-cover==10.6.0"
          DIFF_FORMAT: lcov
          DIFF_REPORT: lcov.info
          MIN: "80"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
        run: |
          bash "$RUNNER_TEMP/diff-coverage.sh" changed
      - name: Characterization first of root
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.bypass.outputs.id == '' && steps.measure-root.outcome == 'success' && steps.measure-root.outputs.skip != 'true' }}
        env:
          ABSENT: fail
          APP_ID: root
          APP_PATH: "."
          BASE_REF: "${{ github.base_ref }}"
          BASE_REPORT: ".coverage-base/root/lcov.info"
          DIFF_FORMAT: lcov
          DIFF_REPORT: lcov.info
          PR_NUMBER: "${{ github.event.pull_request.number }}"
          SOURCE_EXT: rs
        run: |
          bash "$RUNNER_TEMP/diff-coverage.sh" characterization
