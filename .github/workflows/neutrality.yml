# The forbidden-token check, a required check of the default branch next to
# `required`. It checks the tokens, keyed (neutrality/forbidden.hmac), over the tree,
# its paths and every commit message. It fails closed without the
# NEUTRALITY_HMAC_KEY secret (so on pull requests from forks) and never prints the
# key or a token. It is hand-written: ci-baseline renders `required`, not this check.
name: Neutrality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  neutrality:
    name: neutrality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          toolchain: 1.99.0
      - name: Check forbidden tokens
        env:
          NEUTRALITY_HMAC_KEY: ${{ secrets.NEUTRALITY_HMAC_KEY }}
        run: cargo test --locked --test neutrality -- --include-ignored
