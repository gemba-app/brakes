name: Reusable verify
# Generated by brakes ci-baseline 1.0.0 (SPEC-ci-baseline.md, "Reusable
# workflow"): the setup comes from the stack packs and every pin from the shared table,
# so a test fails when this file and its render differ (UPDATE_GOLDENS=1 rewrites it).
# Callers keep scope, workflow-lint and required; this runs their declared commands.
on:
  workflow_call:
    inputs:
      commands:
        description: JSON array of lint, test, verify and build, in run order.
        type: string
        required: true
      profile-path:
        description: Where the commands are declared, relative to working-directory.
        type: string
        default: .agent-setup/project.json
      working-directory:
        description: The app directory, relative to the checkout.
        type: string
        default: .
      stack:
        description: The stack pack whose setup runs (rust, python-uv, node, go).
        type: string
        required: true
      runs-on:
        description: The runner label, JSON-quoted; one of the labels the installer renders.
        type: string
        default: '"ubuntu-24.04"'
      tier:
        description: The caller's tier (full or docs); the callee never filters paths.
        type: string
        required: true
    outputs:
      result:
        description: The verify job's status (success, failure or cancelled).
        value: ${{ jobs.verify.outputs.result }}
permissions:
  contents: read
jobs:
  verify:
    name: verify
    if: inputs.tier != 'docs'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      - name: Check the inputs
        env:
          COMMANDS: "${{ inputs.commands }}"
          LABELS: "\"ubuntu-24.04\""
          PROFILE_PATH: "${{ inputs.profile-path }}"
          RUNS_ON: "${{ inputs.runs-on }}"
          STACK: "${{ inputs.stack }}"
          STACKS: rust python-uv node go
          TIER: "${{ inputs.tier }}"
          WORKING_DIRECTORY: "${{ inputs.working-directory }}"
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          fail() {
            printf '::error::%s\n' "$1"
            exit 1
          }

          case " ${STACKS:?} " in *" ${STACK:-} "*) ;; *) fail "stack '${STACK:-}' is not one of: $STACKS" ;; esac
          case " ${LABELS:?} " in *" ${RUNS_ON:-} "*) ;; *) fail "runs-on '${RUNS_ON:-}' is not one of: $LABELS" ;; esac
          case "${TIER:-}" in full | docs) ;; *) fail "tier '${TIER:-}' is not full or docs" ;; esac
          if ! printf '%s' "${COMMANDS:-}" | jq -e 'type == "array" and length > 0 and all(.[]; . == "lint" or . == "test" or . == "verify" or . == "build")' >/dev/null 2>&1; then
            fail "commands '${COMMANDS:-}' is not a JSON array of lint, test, verify and build"
          fi
          for path in "${WORKING_DIRECTORY:-}" "${PROFILE_PATH:-}"; do
            case "/$path/" in //* | */../* | *//*) fail "path '$path' is not a relative path inside the checkout" ;; esac
          done
          echo "inputs: stack $STACK, runs-on $RUNS_ON, tier $TIER, commands $COMMANDS"
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Install Rust toolchain
        if: inputs.stack == 'rust'
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          components: "clippy, rustfmt"
          toolchain: "1.99"
      - name: Cache cargo registry and target
        if: inputs.stack == 'rust'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: "${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}"
          workspaces: "${{ inputs.working-directory }}"
      - name: Install uv
        if: inputs.stack == 'python-uv'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: "false"
          version: "0.13.6"
      - name: Restore uv cache
        if: inputs.stack == 'python-uv'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: "${{ runner.os }}-uv-${{ hashFiles('${{ inputs.working-directory }}/uv.lock') }}"
          path: "~/.cache/uv"
      - name: Install Python
        if: inputs.stack == 'python-uv'
        working-directory: "${{ inputs.working-directory }}"
        run: uv python install
      - name: Sync dependencies
        if: inputs.stack == 'python-uv'
        working-directory: "${{ inputs.working-directory }}"
        run: uv sync --frozen
      - name: Save uv cache
        if: inputs.stack == 'python-uv' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: "${{ runner.os }}-uv-${{ hashFiles('${{ inputs.working-directory }}/uv.lock') }}"
          path: "~/.cache/uv"
      - name: Set up Node
        if: inputs.stack == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "${{ inputs.working-directory }}/.nvmrc"
          package-manager-cache: "false"
      - name: Restore npm store
        if: inputs.stack == 'node'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: "${{ runner.os }}-npm-${{ hashFiles('${{ inputs.working-directory }}/package-lock.json') }}"
          path: "~/.npm"
      - name: Install dependencies
        if: inputs.stack == 'node'
        working-directory: "${{ inputs.working-directory }}"
        run: npm ci
      - name: Save npm store
        if: inputs.stack == 'node' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: "${{ runner.os }}-npm-${{ hashFiles('${{ inputs.working-directory }}/package-lock.json') }}"
          path: "~/.npm"
      - name: Set up Go
        if: inputs.stack == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: "false"
          go-version-file: "${{ inputs.working-directory }}/go.mod"
      - name: Restore Go module and build caches
        if: inputs.stack == 'go'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: "${{ runner.os }}-go-${{ hashFiles('${{ inputs.working-directory }}/go.sum') }}"
          path: |-
            ~/go/pkg/mod
            ~/.cache/go-build
      - name: Download and verify modules
        if: inputs.stack == 'go'
        working-directory: "${{ inputs.working-directory }}"
        env:
          GOFLAGS: "-mod=readonly"
        run: "go mod download && go mod verify"
      - name: Save Go module and build caches
        if: inputs.stack == 'go' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: "${{ runner.os }}-go-${{ hashFiles('${{ inputs.working-directory }}/go.sum') }}"
          path: |-
            ~/go/pkg/mod
            ~/.cache/go-build
      - name: Run the declared commands
        working-directory: "${{ inputs.working-directory }}"
        env:
          COMMANDS: "${{ inputs.commands }}"
          PROFILE_PATH: "${{ inputs.profile-path }}"
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          : "${COMMANDS:?COMMANDS is not set}"
          : "${PROFILE_PATH:?PROFILE_PATH is not set}"
          names="$(printf '%s' "$COMMANDS" | jq -r '.[]')"
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            cmd="$(jq -r --arg name "$name" '.commands[$name] // empty' "$PROFILE_PATH")"
            if [ -z "$cmd" ]; then
              echo "::error::Verification command missing: commands.$name is not declared in $PROFILE_PATH"
              exit 1
            fi
            echo "$name: $cmd"
            bash -euo pipefail -c "$cmd"
          done <<< "$names"
      - id: result
        name: Report the result
        if: always()
        env:
          STATUS: "${{ job.status }}"
        run: "echo \"result=$STATUS\" >> \"$GITHUB_OUTPUT\""
