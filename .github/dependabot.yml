# Dependency updates (brakes repo-baseline seed): yours to edit. The auditor
# checks that every entry keeps a cooldown, that github-actions stays and that
# minor and patch updates stay grouped. Reviewers come from CODEOWNERS.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 2
